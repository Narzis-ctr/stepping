<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="步步" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#f4f8fd" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%235b9df0'/%3E%3Cpath d='M150 262l68 68 146-160' fill='none' stroke='white' stroke-width='42' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%235b9df0'/%3E%3Cpath d='M150 262l68 68 146-160' fill='none' stroke='white' stroke-width='42' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="manifest" href="manifest.json" />
<title>步步</title>
<style>
  :root{
    --bg:#f4f8fd;
    --card:#ffffff;
    --ink:#1f2733;
    --sub:#8a93a3;
    --line:#e5edf6;
    --accent:#5b9df0;
    --accent-soft:#e6f0fd;
    --done:#c2cbd8;
    --danger:#ef5f6b;
    --shadow:0 1px 3px rgba(31,39,51,.04),0 8px 24px rgba(60,110,190,.07);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --nav-h:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  /* 用动态视口高度：普通浏览器里地址栏/底栏会占空间，svh/dvh 能自适应，避免底部导航被挡 */
  body{
    height:100vh;height:100svh;
  }
  @supports (height: 100dvh){ body{ height:100dvh; } }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* ---- 顶部标题 + 清单标签栏 ---- */
  header{padding:calc(var(--safe-top) + 14px) 0 0;background:var(--bg);flex:0 0 auto;}
  .title-row{display:flex;align-items:flex-start;justify-content:space-between;padding:0 20px 12px;}
  .title-row h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.5px;}
  .title-wrap{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .title-wrap .subtitle{font-size:13px;color:var(--sub);font-weight:400;line-height:1.2;}
  .title-row .count{font-size:13px;color:var(--sub);}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:0 20px 12px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs.hidden{display:none;}
  /* 日期切换条（仅日程视图显示） */
  .datebar{display:flex;align-items:center;justify-content:center;gap:14px;padding:0 20px 12px;}
  .datebar.hidden{display:none;}
  .datebar .nav-arrow{
    width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--sub);cursor:pointer;
    font-size:15px;flex:0 0 auto;transition:.15s;user-select:none;
  }
  .datebar .nav-arrow:active{background:var(--accent-soft);color:var(--accent);}
  .datebar .date-label{
    font-size:15px;font-weight:600;min-width:160px;text-align:center;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .datebar .date-label .today-badge{
    font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);
    padding:2px 7px;border-radius:8px;
  }
  .datebar input.hidden-date{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
  .tab{
    flex:0 0 auto;padding:7px 15px;border-radius:20px;font-size:14px;font-weight:500;
    background:var(--card);color:var(--sub);border:1px solid var(--line);
    white-space:nowrap;transition:.2s;cursor:pointer;user-select:none;
  }
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tab.add-list{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft);font-weight:600;}
  /* ---- 主体区域 ---- */
  .viewport{flex:1 1 auto;overflow:hidden;position:relative;}
  .track{display:flex;height:100%;transition:transform .32s cubic-bezier(.22,.61,.36,1);}
  .page{flex:0 0 100%;height:100%;overflow-y:auto;padding:4px 16px calc(var(--nav-h) + 100px + var(--safe-bottom));-webkit-overflow-scrolling:touch;}
  .single{position:absolute;inset:0;overflow-y:auto;padding:4px 16px calc(var(--nav-h) + 100px + var(--safe-bottom));-webkit-overflow-scrolling:touch;display:none;}
  /* ---- 任务卡片 ---- */
  .task{
    display:flex;align-items:flex-start;gap:11px;background:var(--card);
    border-radius:14px;padding:9px 15px;margin-top:7px;box-shadow:var(--shadow);
    transition:.15s;position:relative;
  }
  .task:active{transform:scale(.99);}
  .check{
    flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--done);
    margin-top:2px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;
  }
  .check svg{width:11px;height:11px;opacity:0;transition:.15s;}
  .task.done .check{background:var(--accent);border-color:var(--accent);}
  .task.done .check svg{opacity:1;}
  .task-body{flex:1 1 auto;min-width:0;}
  .task-head{display:flex;align-items:baseline;gap:8px;}
  .task-head .task-text{flex:1 1 auto;min-width:0;}
  .task-head .chip.time{flex:0 0 auto;align-self:center;}
  .task-text{font-size:15px;line-height:1.3;word-break:break-word;transition:.15s;font-weight:500;}
  .task.done .task-text{color:var(--done);text-decoration:line-through;font-weight:400;}
  /* 节点：折叠箭头 + 进度 */
  .caret{flex:0 0 auto;width:16px;margin-top:3px;text-align:center;color:var(--sub);
    cursor:pointer;font-size:10px;transition:transform .2s;user-select:none;}
  .caret.open{transform:rotate(90deg);}
  .caret.leaf{visibility:hidden;}
  .check.ring{border:none;position:relative;}
  .check.ring::before{content:"";position:absolute;inset:3px;background:var(--card);border-radius:50%;}
  .check.ring svg{position:relative;z-index:1;}
  .prog{height:5px;border-radius:3px;background:#eef0f2;overflow:hidden;margin-top:6px;}
  .prog-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .35s ease;}
  .prog-label{font-size:11px;color:var(--sub);margin-top:4px;}
  .prog-label b{color:var(--accent);font-weight:700;}
  .prog-label .alldone{color:#34c759;}
  .children{margin:4px 0 2px 22px;padding-left:11px;border-left:2px solid var(--line);}
  .children .task{margin-top:6px;}
  .task-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center;}
  .chip{font-size:11px;padding:2px 8px;border-radius:9px;background:#f2f2f4;color:var(--sub);display:inline-flex;align-items:center;gap:3px;line-height:1.5;}
  .chip.time{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .chip.parent{background:transparent;color:var(--sub);padding-left:2px;}
  .chip.break{background:transparent;border:1px dashed var(--line);color:var(--sub);cursor:pointer;font-weight:500;}
  .chip.break:active{background:var(--accent-soft);}
  .chip.focus{background:transparent;border:1px solid var(--line);color:var(--sub);cursor:pointer;font-weight:500;}
  .chip.focus:active{background:var(--accent-soft);}
  .chip.focused{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .del{flex:0 0 auto;color:var(--sub);font-size:19px;line-height:1;padding:2px 3px;cursor:pointer;opacity:.3;margin-top:1px;}
  .del:active{opacity:1;color:var(--danger);}
  .empty{text-align:center;color:var(--sub);font-size:14px;margin-top:70px;line-height:2;}
  .empty .big{font-size:44px;display:block;margin-bottom:8px;}
  /* ---- 底部提交栏 ---- */
  .composer{
    position:absolute;left:0;right:0;bottom:var(--nav-h);padding:12px 16px 10px;
    background:linear-gradient(180deg,rgba(244,248,253,0) 0%,var(--bg) 34%);
  }
  .picker-row{display:none;margin-bottom:8px;}
  .picker-row.show{display:flex;gap:8px;align-items:center;}
  .picker-row input{
    flex:1 1 auto;border:none;background:var(--card);border-radius:16px;padding:10px 14px;
    font-size:15px;box-shadow:var(--shadow);color:var(--ink);font-family:inherit;
  }
  .picker-row .clear-time{font-size:13px;color:var(--danger);padding:6px 10px;cursor:pointer;}
  /* 已选上级目标的提示条（输入框上方，一行文字，可点✕取消） */
  .parent-hint{display:none;align-items:center;gap:6px;margin-bottom:8px;font-size:13px;
    color:var(--accent);background:var(--accent-soft);border-radius:12px;padding:8px 12px;}
  .parent-hint.show{display:flex;}
  .parent-hint .ph-x{margin-left:auto;cursor:pointer;opacity:.7;font-size:15px;line-height:1;padding:0 2px;}
  .parent-hint .ph-x:active{opacity:1;}
  /* 挂靠上级弹层：分组竖排的目标列表 */
  .ph-close{width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--sub);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;user-select:none;}
  .ph-close:active{background:var(--accent-soft);color:var(--accent);}
  .ph-body{max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .ph-group-label{font-size:12px;font-weight:700;color:var(--sub);margin:14px 2px 6px;letter-spacing:.5px;}
  .ph-group-label:first-child{margin-top:2px;}
  .ph-opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;
    background:var(--bg);margin-bottom:8px;cursor:pointer;transition:.12s;font-size:15px;color:var(--ink);}
  .ph-opt:active{transform:scale(.99);}
  .ph-opt.sel{background:var(--accent);color:#fff;}
  .ph-opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--done);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;transition:.12s;}
  .ph-opt.sel .radio{border-color:#fff;}
  .ph-opt.sel .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff;}
  .ph-opt .txt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ph-empty{text-align:center;color:var(--sub);font-size:14px;padding:28px 0;line-height:1.9;}
  .input-row{display:flex;gap:8px;align-items:center;}
  .composer input.main-input{
    flex:1 1 auto;min-width:0;border:none;outline:none;background:var(--card);
    border-radius:24px;padding:13px 16px;font-size:16px;box-shadow:var(--shadow);color:var(--ink);
  }
  .composer input.main-input::placeholder{color:var(--sub);}
  .icon-btn{
    flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:none;background:var(--card);
    color:var(--sub);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:var(--shadow);transition:.15s;
  }
  .icon-btn.on{background:var(--accent-soft);color:var(--accent);}
  .submit{
    flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:none;background:var(--accent);
    color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 4px 14px rgba(91,157,240,.4);transition:.15s;
  }
  .submit:active{transform:scale(.9);}
  /* ---- 底部四宫格导航 ---- */
  .nav{
    position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-bottom));
    padding-bottom:var(--safe-bottom);display:flex;background:rgba(255,255,255,.92);
    backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:1px solid var(--line);
  }
  .nav-item{
    flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--sub);font-size:11px;cursor:pointer;transition:.15s;user-select:none;
  }
  .nav-item .ni{font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .nav-item .ni svg{width:23px;height:23px;display:block;}
  .nav-item.active{color:var(--accent);}

  /* ---- header 模式切换图标（清单/时间轴） ---- */
  .mode-toggle{display:flex;align-items:center;cursor:pointer;color:var(--sub);user-select:none;padding:2px;}
  .mode-toggle svg{width:21px;height:21px;display:block;}
  .mode-toggle.on{color:var(--accent);}

  /* ---- 番茄钟计时浮层 ---- */
  .timer-mask{
    position:fixed;inset:0;background:rgba(32,35,46,.32);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:60;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .timer-mask.show{opacity:1;pointer-events:auto;}
  .timer-card{
    width:86%;max-width:340px;background:var(--card);border-radius:24px;
    padding:26px 24px 22px;box-shadow:0 12px 40px rgba(40,45,80,.24);text-align:center;
    transform:scale(.92);transition:transform .24s cubic-bezier(.22,.61,.36,1);
  }
  .timer-mask.show .timer-card{transform:scale(1);}
  .timer-task{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px;line-height:1.35;}
  .timer-sub{font-size:12px;color:var(--sub);margin-bottom:18px;}
  .timer-clock{font-size:56px;font-weight:700;letter-spacing:1px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1;}
  .timer-adjust{display:flex;align-items:center;justify-content:center;gap:18px;margin:16px 0 22px;}
  .timer-adjust .step{
    width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);
    font-size:22px;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;
  }
  .timer-adjust .step:active{background:var(--accent-soft);color:var(--accent);}
  .timer-adjust .step.disabled{opacity:.3;pointer-events:none;}
  .timer-adjust .len{font-size:14px;color:var(--sub);min-width:64px;}
  .timer-btns{display:flex;flex-direction:column;gap:10px;}
  .timer-btns .btn{
    padding:13px;border-radius:15px;font-size:16px;font-weight:600;cursor:pointer;user-select:none;border:none;
  }
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.primary:active{transform:scale(.98);}
  .btn.ghost{background:var(--bg);color:var(--ink);}
  .btn.danger{background:transparent;color:var(--sub);font-weight:500;font-size:14px;padding:6px;}
  .btn.danger:active{color:var(--danger);}

  /* ---- 通用应用内弹窗（替代浏览器 prompt/confirm/alert）---- */
  .dialog-mask{
    position:fixed;inset:0;background:rgba(32,35,46,.32);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:80;padding:24px;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .dialog-mask.show{opacity:1;pointer-events:auto;}
  .dialog-card{
    width:100%;max-width:340px;background:var(--card);border-radius:22px;
    padding:22px 20px 18px;box-shadow:0 12px 40px rgba(40,45,80,.24);
    transform:scale(.92);transition:transform .24s cubic-bezier(.22,.61,.36,1);
  }
  .dialog-mask.show .dialog-card{transform:scale(1);}
  .dialog-title{font-size:17px;font-weight:700;color:var(--ink);text-align:center;line-height:1.4;}
  .dialog-msg{font-size:14px;color:var(--sub);text-align:center;line-height:1.6;margin-top:8px;white-space:pre-line;}
  .dialog-input{
    width:100%;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;
    font-size:16px;color:var(--ink);background:var(--bg);outline:none;box-sizing:border-box;transition:.15s;
  }
  .dialog-input:focus{border-color:var(--accent);background:var(--card);}
  .dialog-btns{display:flex;flex-direction:column;gap:9px;margin-top:20px;}
  .dialog-btns .btn{padding:13px;border-radius:15px;font-size:16px;font-weight:600;cursor:pointer;user-select:none;border:none;text-align:center;}
  .dialog-btns .btn.ghost{background:var(--bg);color:var(--ink);}
  .dialog-btns .btn.ghost:active{background:var(--accent-soft);}
  .dialog-btns .btn.dngr{background:transparent;color:var(--danger);font-weight:600;}
  .dialog-btns .btn.dngr:active{background:rgba(230,90,90,.08);}

  /* ---- 时间轴视图 ---- */
  .timeline-wrap{padding:8px 0 12px;}
  .tl-empty{text-align:center;color:var(--sub);font-size:14px;margin-top:70px;line-height:2;}
  .tl-empty .big{font-size:44px;display:block;margin-bottom:8px;}
  .tl-grid{position:relative;margin:6px 0 22px;}
  .tl-hour{position:absolute;left:0;right:0;display:flex;align-items:flex-start;}
  .tl-hour .hh{width:44px;flex:0 0 auto;font-size:11px;color:var(--sub);transform:translateY(-6px);}
  .tl-hour .ln{flex:1 1 auto;border-top:1px dashed var(--line);margin-top:0;}
  .tl-blocks{position:absolute;left:52px;right:6px;top:0;bottom:0;}
  .tl-block{
    position:absolute;left:0;right:0;border-radius:10px;padding:5px 9px;overflow:hidden;
    color:#fff;font-size:12px;line-height:1.3;box-shadow:0 2px 6px rgba(40,45,80,.14);
  }
  .tl-block b{font-weight:600;}
  .tl-block .bt{opacity:.85;font-size:11px;}
  .tl-sec-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;}
  .tl-sec-head h3{font-size:15px;font-weight:700;margin:0;color:var(--ink);}
  .tl-chart-toggle{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px;}
  .tl-chart-toggle .seg{
    width:34px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    color:var(--sub);cursor:pointer;transition:.15s;user-select:none;
  }
  .tl-chart-toggle .seg svg{width:17px;height:17px;display:block;}
  .tl-chart-toggle .seg.on{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(31,39,51,.1);}
  .tl-stats{margin-top:6px;}
  /* 饼（环形）图 */
  .tl-pie-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:16px;}
  .tl-pie{flex:0 0 auto;position:relative;width:132px;height:132px;}
  .tl-pie svg{transform:rotate(-90deg);display:block;}
  .tl-pie-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .tl-pie-center .big{font-size:15px;font-weight:700;color:var(--ink);line-height:1.05;}
  .tl-pie-center .sm{font-size:10px;color:var(--sub);margin-top:2px;}
  .tl-pie-legend{width:100%;}
  .tl-pie-legend .lg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);margin-bottom:9px;}
  .tl-pie-legend .lg:last-child{margin-bottom:0;}
  .tl-pie-legend .lg .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tl-pie-legend .lg .vl{flex:0 0 auto;color:var(--sub);font-size:12px;}
  /* 条形图 */
  .tl-barchart{margin-bottom:14px;}
  .tl-stat-row{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
  .tl-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
  .tl-stat-body{flex:1 1 auto;min-width:0;}
  .tl-stat-top{display:flex;justify-content:space-between;font-size:13px;color:var(--ink);margin-bottom:5px;}
  .tl-stat-top .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tl-stat-top .mins{color:var(--sub);font-size:12px;flex:0 0 auto;margin-left:8px;}
  .tl-bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden;}
  .tl-bar-fill{height:100%;border-radius:5px;transition:width .3s;}
  .tl-total{text-align:center;font-size:13px;color:var(--sub);margin:2px 0 24px;}

  /* ---- 月度概览（甘特式跨度条） ---- */
  .mv-wrap{padding:6px 0 12px;}
  .mv-monthbar{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0 14px;}
  .mv-monthbar .nav-arrow{
    width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--sub);cursor:pointer;
    font-size:15px;flex:0 0 auto;user-select:none;transition:.15s;
  }
  .mv-monthbar .nav-arrow:active{background:var(--accent-soft);color:var(--accent);}
  .mv-month-label{font-size:15px;font-weight:600;color:var(--ink);min-width:110px;text-align:center;}

<script>
const STORE_KEY = "shiguang.v3";
const TIMER_KEY = "shiguang.timer";   // 活动中的番茄钟，刷新/切后台不丢
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';
const VIEW_TITLE = { day:"日程", week:"周计划", month:"月计划", year:"年度目标" };
const VIEW_PLACEHOLDER = {
  day:"今天想做点什么？回车添加…", week:"这周要推进的事…",
  month:"这个月的计划…", year:"今年要实现的目标…"
};

/* ---------- 应用内弹窗（替代浏览器 prompt / confirm / alert）----------
   全部返回 Promise，用 await 调用，风格与 App 内其它弹层一致 */
const dlgMask=()=>document.getElementById("dialogMask");
function _closeDialog(){ const m=dlgMask(); if(m) m.classList.remove("show"); }
function _openDialog({title="", msg="", input=false, inputValue="", placeholder="", buttons=[]}){
  return new Promise(resolve=>{
    const mask=dlgMask();
    mask.querySelector("#dialogTitle").textContent=title;
    const msgEl=mask.querySelector("#dialogMsg");
    msgEl.textContent=msg; msgEl.style.display=msg?"block":"none";
    const inp=mask.querySelector("#dialogInput");
    if(input){
      inp.style.display="block"; inp.value=inputValue; inp.placeholder=placeholder||"";
    } else inp.style.display="none";
    const btnBox=mask.querySelector("#dialogBtns"); btnBox.innerHTML="";
    const done=(val)=>{ _closeDialog(); mask.onclick=null; document.removeEventListener("keydown",onKey); resolve(val); };
    buttons.forEach(b=>{
      const el=document.createElement("div");
      el.className="btn "+(b.style||"ghost");
      el.textContent=b.label;
      el.onclick=()=>done(typeof b.value==="function"? b.value() : b.value);
      btnBox.appendChild(el);
    });
    // 点遮罩空白 = 取消（返回第一个 value 为 null 的按钮结果，否则 null）
    mask.onclick=(e)=>{ if(e.target===mask) done(null); };
    const onKey=(e)=>{
      if(e.key==="Escape") done(null);
      else if(e.key==="Enter" && input){ const ok=buttons.find(b=>b.enter); if(ok) done(typeof ok.value==="function"? ok.value():ok.value); }
    };
    document.addEventListener("keydown",onKey);
    mask.classList.add("show");
    if(input) setTimeout(()=>{ inp.focus(); inp.select(); },60);
  });
}
// 提示：只有一个"知道了"按钮
function dlgAlert(msg,title=""){ return _openDialog({title:title||msg,msg:title?msg:"",buttons:[{label:"知道了",style:"ghost",value:true,enter:true}]}); }
// 确认：返回 true/false；danger=true 时确认按钮标红
function dlgConfirm(msg,{title="",okLabel="确定",cancelLabel="取消",danger=false}={}){
  return _openDialog({title:title||"确认",msg,buttons:[
    {label:okLabel,style:danger?"dngr":"ghost",value:true,enter:true},
    {label:cancelLabel,style:"ghost",value:false},
  ]});
}
// 输入：返回字符串（取消返回 null）
function dlgPrompt(title,{msg="",value="",placeholder="",okLabel="确定"}={}){
  return _openDialog({title,msg,input:true,inputValue:value,placeholder,buttons:[
    {label:okLabel,style:"ghost",value:()=>dlgMask().querySelector("#dialogInput").value,enter:true},
    {label:"取消",style:"ghost",value:null},
  ]});
}

/* ---------- 数据 ----------
 state = {
   day:  { lists:[ {name, tasks:[]} ] },   // 可滑动多清单；每条 day 任务带 date:"YYYY-MM-DD"
   week: { tasks:[] }, month:{ tasks:[] }, year:{ tasks:[] }
 }
 task = { id, text, done, createdAt, due(可空), date(仅日程), children:[子任务id], parentText(可空),
          sessions:[{start,end,focusSec}] 专注记录 }
*/
let state = load();
let view = "day";      // day | week | month | year
let current = 0;       // 日程内当前清单索引
let useTime = false;   // 是否展开时间选择
let currentDate = todayStr();   // 日程当前查看的日期
let dayMode = "list";  // 日程视图：list 清单 | timeline 时间轴
let monthMode = "list"; // 月计划视图：list 清单 | overview 本月概览
let chartMode = "pie"; // 专注分布图：pie 扇形 | bar 条形
let mvMonth = todayStr().slice(0,7);   // 月度概览当前查看的月份 YYYY-MM
let pendingParentId = null;   // 新任务待挂靠的上级目标 id

/* ---------- 日期工具 ---------- */
function pad2(n){ return String(n).padStart(2,"0"); }
function dateStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function todayStr(){ return dateStr(new Date()); }
function shiftDate(str, days){ const d=new Date(str+"T00:00:00"); d.setDate(d.getDate()+days); return dateStr(d); }
// 顶部日期条的友好文字：今天 / 明天 / 昨天 / 周几 · M月D日
function fmtDateLabel(str){
  const d=new Date(str+"T00:00:00");
  const t=todayStr();
  const week=["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  const md=`${d.getMonth()+1}月${d.getDate()}日`;
  if(str===t) return `今天 · ${md}`;
  if(str===shiftDate(t,1)) return `明天 · ${md}`;
  if(str===shiftDate(t,-1)) return `昨天 · ${md}`;
  return `${week} · ${md}`;
}

function blank(){
  return {
    day:{ lists:[ {name:"今天",tasks:[]}, {name:"工作",tasks:[]}, {name:"生活",tasks:[]} ] },
    week:{ tasks:[] }, month:{ tasks:[] }, year:{ tasks:[] }
  };
}

/* ---------- 示例数据：一棵完整的「年→月→周→日」目标树 ---------- */
function seed(){
  const s = blank();
  let n = 0;
  const id = ()=> "seed-"+(n++);           // 稳定 id，便于父子挂钩
  const mk = (text, extra={})=> Object.assign(
    { id:id(), text, done:false, createdAt:Date.now()-(1000*n), due:null, parentText:null, children:[], sessions:[] }, extra);

  // —— 日程：把最细的执行项放进「今天 / 工作 / 生活」——
  const dToday = s.day.lists[0].tasks;   // 今天
  const dWork  = s.day.lists[1].tasks;   // 工作
  const dLife  = s.day.lists[2].tasks;   // 生活

  const nowH = new Date(); nowH.setHours(20,0,0,0);
  const pad=x=>String(x).padStart(2,"0");
  const today = todayStr();
  const todayAt=(h,m)=>{ const d=new Date(); d.setHours(h,m,0,0);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(h)}:${pad(m)}`; };
  // 造几段"今天"的专注记录，让时间轴一打开就有内容
  const atMs=(h,m)=>{ const d=new Date(); d.setHours(h,m,0,0); return d.getTime(); };
  const sess=(sh,sm,mins)=>({ start:atMs(sh,sm), end:atMs(sh,sm)+mins*60000, focusSec:mins*60 });

  // 读书线的叶子（日程任务带 date）
  const read30 = mk("读《原则》30页", { parentText:"这周读完《原则》上半", due:todayAt(21,0), done:true, date:today, sessions:[sess(9,10,50), sess(10,20,25)] });
  const readNote = mk("整理2页读书笔记", { parentText:"这周读完《原则》上半", due:todayAt(21,40), date:today });
  // 跑步线的叶子
  const run1 = mk("晨跑 5 公里", { parentText:"本周跑步3次", done:true, date:today, sessions:[sess(7,0,30)] });
  const run2 = mk("晚间快走 40 分钟", { parentText:"本周跑步3次", due:todayAt(19,30), date:today });
  // 作品集线的叶子
  const prd = mk("写完 PRD 初稿第一章", { parentText:"完成作品集2个案例", due:todayAt(15,0), date:today, sessions:[sess(14,0,25), sess(15,0,45)] });
  dToday.push(read30, readNote, run2);
  dWork.push(prd);
  dLife.push(run1);

  // —— 周计划 ——
  const wRead = mk("这周读完《原则》上半", { parentText:"6月读完2本书", children:[read30.id, readNote.id] });
  const wRun  = mk("本周跑步3次",         { parentText:"6月保持20次运动", children:[run1.id, run2.id] });
  const wPrd  = mk("完成作品集2个案例",     { parentText:"上半年产出完整作品集", children:[prd.id] });
  s.week.tasks.push(wRead, wRun, wPrd);

  // —— 月计划 ——
  const mBook = mk("6月读完2本书",     { parentText:"今年读24本书",        children:[wRead.id] });
  const mMove = mk("6月保持20次运动",  { parentText:"今年养成运动习惯",     children:[wRun.id] });

    const raw = localStorage.getItem(STORE_KEY);

}
// 迁移：给还没有 date 的日程任务补上"今天"、给所有任务补 sessions，保证旧数据平滑升级、不丢
function migrate(d){
  const t=todayStr();
  try{
    (d.day.lists||[]).forEach(l=>(l.tasks||[]).forEach(task=>{
      if(!task.date) task.date=t;
      if(!task.sessions) task.sessions=[];
    }));
    ["week","month","year"].forEach(v=>(d[v]&&d[v].tasks||[]).forEach(task=>{
      if(!task.sessions) task.sessions=[];
    }));
    // doneAt / manualSpan 为可选新字段，无需回填（缺省即"未记录/自动"）
  }catch(e){}
  return d;
}
function save(){
  try{

    return true;

    return false;
  }
}
function uid(){ return Date.now()+"-"+Math.random().toString(36).slice(2,6); }

/* ---------- 全量任务索引：跨视图按 id 找任务 ---------- */
let expanded = {};  // { taskId: true } 记住展开状态
function allTasks(){
  const out=[];
  state.day.lists.forEach(l=>l.tasks.forEach(t=>out.push(t)));
  ["week","month","year"].forEach(v=>state[v].tasks.forEach(t=>out.push(t)));
  return out;
}
function taskById(id){ return allTasks().find(t=>t.id===id) || null; }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function childrenOf(task){
  if(!task.children||!task.children.length) return [];
  return task.children.map(taskById).filter(Boolean);
}
/* 递归进度：叶子看 done，父节点看所有后代叶子完成比例 */
function progressOf(task){
  const kids=childrenOf(task);
  if(!kids.length) return { done: task.done?1:0, total:1, leaf:true };
  let done=0,total=0;
  kids.forEach(k=>{ const p=progressOf(k); done+=p.done; total+=p.total; });
  return { done, total, leaf:false };
}
// 收集某目标下所有后代叶子任务（含自身若为叶子），用于月度概览取活动日期
function leafDescendants(task, out){
  out=out||[];
  const kids=childrenOf(task);
  if(!kids.length){ out.push(task); return out; }
  kids.forEach(k=>leafDescendants(k,out));
  return out;
}
// 某月目标的"活动日期集合"：来自所有后代叶子（日任务）的 date / 专注 session / 完成日
function activeDatesOf(task){
  const dates=new Set();
  leafDescendants(task).forEach(leaf=>{
    if(leaf.date) dates.add(leaf.date);
    (leaf.sessions||[]).forEach(s=>dates.add(dateStr(new Date(s.start))));
    if(leaf.doneAt) dates.add(dateStr(new Date(leaf.doneAt)));
  });
  if(task.doneAt) dates.add(dateStr(new Date(task.doneAt)));
  return dates;
}

    buttons:[

    const cnt=list.tasks.length;
    if(cnt>0){
      const ok=await dlgConfirm(`其中 ${cnt} 个任务也会一并删除。`,{title:`删除清单「${list.name}」？`,okLabel:"删除",danger:true});

    allTasks().forEach(t=>{ if(t.children) t.children=t.children.filter(id=>!ids.includes(id)); });
    state.day.lists.splice(i,1);
    if(current>=state.day.lists.length) current=state.day.lists.length-1;
    save(); rerender(); goTo(current);
  }
}

/* ---------- 渲染任务列表 ---------- */
// depth: 缩进层级; ownerView: 该任务实际所属视图(用于删除/拆解定位)
function renderTask(task, listRef, ownerView){
  const wrap=document.createElement("div");   // 容纳卡片 + 子节点
  const el=document.createElement("div");
  el.className="task"+(task.done?" done":"");

  const kids=childrenOf(task);
  const hasKids=kids.length>0;
  const prog=progressOf(task);

  // 折叠箭头
  const caret=document.createElement("div");
  caret.className="caret"+(hasKids?"":" leaf")+(expanded[task.id]?" open":"");
  caret.textContent="▶";
  if(hasKids) caret.onclick=(e)=>{ e.stopPropagation(); expanded[task.id]=!expanded[task.id]; rerender(); };
  el.appendChild(caret);

  // 勾选圈：有子节点时按进度显示、不可直接勾（由子节点决定）
  const check=document.createElement("div");
  const pctRatio = prog.total? prog.done/prog.total : 0;
  const full = hasKids && pctRatio>=1;
  check.className="check"+(hasKids && !full ? " ring" : "");
  check.innerHTML=CHECK_SVG;
  if(hasKids){
    if(full){ el.classList.add("done"); }        // 全部子项完成 → 实心对勾
    else check.style.background = `conic-gradient(var(--accent) ${pctRatio*360}deg, #e3e5e8 0deg)`;
    check.onclick=(e)=>{ e.stopPropagation(); expanded[task.id]=!expanded[task.id]; rerender(); };
  }else{
    check.onclick=()=>{ task.done=!task.done; task.doneAt = task.done? Date.now() : null; save(); rerender(); };
  }
  el.appendChild(check);

  const body=document.createElement("div");
  body.className="task-body";
  // 标题行：标题 + 时间 chip 同行（时间靠右，标题占满剩余）
  const head=document.createElement("div");
  head.className="task-head";
  const txt=document.createElement("div");
  txt.className="task-text"; txt.textContent=task.text;
  head.appendChild(txt);
  if(task.due){
    const c=document.createElement("span");
    c.className="chip time"; c.textContent="🕐 "+fmtDue(task.due);
    head.appendChild(c);
  }
  body.appendChild(head);

  // 父节点：进度条 + 文字
  if(hasKids){
    const pct = prog.total? Math.round(prog.done/prog.total*100) : 0;
    const bar=document.createElement("div"); bar.className="prog";
    const fill=document.createElement("div"); fill.className="prog-fill"; fill.style.width=pct+"%";
    bar.appendChild(fill); body.appendChild(bar);
    const lab=document.createElement("div"); lab.className="prog-label";
    lab.innerHTML = pct>=100
      ? `<span class="alldone">✓ 已全部完成</span> · ${prog.done}/${prog.total}`
      : `已推进 <b>${pct}%</b> · ${prog.done}/${prog.total} 项完成`;
    body.appendChild(lab);
  }

  // 次要标签行：挂靠 / 拆解 / 专注（比标题小、灰）
  const tags=document.createElement("div");
  tags.className="task-tags";
  if(task.parentText){
    const c=document.createElement("span");
    c.className="chip parent"; c.textContent="↳ "+task.parentText;
    tags.appendChild(c);
  }
  const nextV=nextViewFor(ownerView);
  if(nextV){
    const b=document.createElement("span");
    b.className="chip break";
    b.textContent="＋ 拆解到"+VIEW_TITLE[nextV];
    b.onclick=(e)=>{ e.stopPropagation(); breakdown(task, ownerView); };
    tags.appendChild(b);
  }
  // 专注：仅日程叶子任务、且看的是今天，才给"开始番茄钟"入口
  if(ownerView==="day" && !hasKids){
    const focusSec=(task.sessions||[]).reduce((s,x)=>s+(x.focusSec||0),0);
    if(currentDate===todayStr()){
      const f=document.createElement("span");
      f.className="chip focus";
      f.textContent="▶ 专注";
      f.onclick=(e)=>{ e.stopPropagation(); openTimer(task); };
      tags.appendChild(f);
    }
    if(focusSec>0){
      const s=document.createElement("span");
      s.className="chip focused";
      s.textContent="🍅 "+fmtDur(focusSec);
      tags.appendChild(s);
    }
  }
  if(tags.children.length) body.appendChild(tags);

  const del=document.createElement("div");
  del.className="del"; del.textContent="×";
  del.onclick=(e)=>{
    e.stopPropagation();
    // 有子节点时提醒会连同下级一起删除
    const kidCount=countDescendants(task);
    const msg = kidCount>0
      ? `这会同时删除它下面的 ${kidCount} 个子任务。`
      : "";
    dlgConfirm(msg,{title:`删除「${task.text}」？`,okLabel:"删除",danger:true}).then(ok=>{
      if(ok) removeTask(task, listRef);
    });
  };

  el.appendChild(body); el.appendChild(del);
  wrap.appendChild(el);

  // 子节点（展开时递归渲染，能看到下一级完成情况）
  if(hasKids && expanded[task.id]){
    const box=document.createElement("div");
    box.className="children";
    const childView=nextViewFor(ownerView);
    const sorted=[...kids].sort((a,b)=>(a.done?1:0)-(b.done?1:0) || b.createdAt-a.createdAt);
    sorted.forEach(k=> box.appendChild(renderTask(k, findListRef(k), childView)));
    wrap.appendChild(box);
  }
  return wrap;
}

// 删除任务：同时从父节点的 children 里摘掉，并删掉其所有子孙
function countDescendants(task){
  let n=0;
  childrenOf(task).forEach(c=>{ n += 1 + countDescendants(c); });
  return n;
}
function removeTask(task, listRef){
  const collect=(t,acc)=>{ acc.push(t.id); childrenOf(t).forEach(c=>collect(c,acc)); return acc; };
  const ids=collect(task,[]);
  // 从所有容器中移除这些 id
  const scrub=arr=>{ for(let i=arr.length-1;i>=0;i--) if(ids.includes(arr[i].id)) arr.splice(i,1); };
  state.day.lists.forEach(l=>scrub(l.tasks));
  ["week","month","year"].forEach(v=>scrub(state[v].tasks));
  // 从任何父节点的 children 引用里移除
  allTasks().forEach(t=>{ if(t.children) t.children=t.children.filter(id=>!ids.includes(id)); });
  save(); rerender();
}

// 找到某任务所在的数组（用于删除定位）
function findListRef(task){
  for(const l of state.day.lists) if(l.tasks.includes(task)) return l.tasks;
  for(const v of ["week","month","year"]) if(state[v].tasks.includes(task)) return state[v].tasks;
  return [];
}

/* ---------- 时间轴：把某天的专注 session 按墙钟排布 ---------- */
// 冷色系调色板，任务 id 稳定哈希取色，跟主色协调
const TL_COLORS=["#5b9df0","#4fc0d8","#5ec6a8","#7aa7f5","#49b0e0","#6bd0c2","#8fb4f7","#57b8cf"];
function colorOf(id){
  let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0;
  return TL_COLORS[h%TL_COLORS.length];
}
// 收集某天（YYYY-MM-DD）所有 session，附带所属任务
function daySessions(dateStr_){
  const out=[];
  state.day.lists.forEach(l=>(l.tasks||[]).forEach(t=>{
    (t.sessions||[]).forEach(s=>{
      if(dateStr(new Date(s.start))===dateStr_) out.push({ task:t, ...s });
    });
  }));
  return out.sort((a,b)=>a.start-b.start);
}
function renderTimeline(){
  const sessions=daySessions(currentDate);
  if(!sessions.length){
    singleEl.innerHTML='<div class="tl-empty"><span class="big">🍅</span>今天还没有专注记录<br>点任务上的「▶ 专注」开始第一段番茄钟</div>';
    return;
  }
  const wrap=document.createElement("div");
  wrap.className="timeline-wrap";

  // —— 专注分布：默认扇形图，可切条形图（放在最前面）——
  const byTask={};
  sessions.forEach(s=>{ (byTask[s.task.id] ||= {task:s.task, sec:0}).sec+=s.focusSec||0; });
  const rows=Object.values(byTask).sort((a,b)=>b.sec-a.sec);
  const totalSec=rows.reduce((s,r)=>s+r.sec,0);

  const stats=document.createElement("div");
  stats.className="tl-stats";
  const head=document.createElement("div");
  head.className="tl-sec-head";
  head.innerHTML=`<h3>专注分布</h3>
    <div class="tl-chart-toggle">
      <div class="seg${chartMode==='pie'?' on':''}" data-chart="pie" title="扇形图">${ICON_PIE}</div>
      <div class="seg${chartMode==='bar'?' on':''}" data-chart="bar" title="条形图">${ICON_BAR}</div>
    </div>`;
  stats.appendChild(head);
  const chartBox=document.createElement("div");
  chartBox.className="tl-chart-box";
  stats.appendChild(chartBox);
  renderChart(chartBox, rows, totalSec);
  head.querySelectorAll(".seg").forEach(seg=>{
    seg.onclick=()=>{
      chartMode=seg.dataset.chart;
      head.querySelectorAll(".seg").forEach(s=>s.classList.toggle("on", s.dataset.chart===chartMode));
      renderChart(chartBox, rows, totalSec);
    };
  });
  wrap.appendChild(stats);

  // —— 时间轴：自动适配范围（最早开始 → 最晚结束）——
  const tlHead=document.createElement("div");
  tlHead.className="tl-sec-head";
  tlHead.style.marginTop="4px";
  tlHead.innerHTML="<h3>时间轴</h3>";
  wrap.appendChild(tlHead);

  const minS=Math.min(...sessions.map(s=>s.start));
  const maxE=Math.max(...sessions.map(s=>s.end));
  const startH=Math.max(0, new Date(minS).getHours() - (new Date(minS).getMinutes()<30?1:0));
  let endH=new Date(maxE).getHours() + (new Date(maxE).getMinutes()>0?1:0) + (new Date(maxE).getMinutes()>=30?1:0);
  endH=Math.min(24, Math.max(endH, startH+1));
  const base=new Date(currentDate+"T00:00:00"); base.setHours(startH,0,0,0);
  const top=base.getTime();
  const span=(endH-startH)*3600000;    // 总跨度(ms)
  const PX_PER_HOUR=64;
  const gridH=(endH-startH)*PX_PER_HOUR;

  const grid=document.createElement("div");
  grid.className="tl-grid"; grid.style.height=gridH+"px";
  for(let h=startH;h<=endH;h++){
    const row=document.createElement("div");
    row.className="tl-hour";
    row.style.top=((h-startH)*PX_PER_HOUR)+"px";
    row.innerHTML=`<span class="hh">${String(h).padStart(2,"0")}:00</span><span class="ln"></span>`;
    grid.appendChild(row);
  }
  const blocks=document.createElement("div");
  blocks.className="tl-blocks"; blocks.style.height=gridH+"px";
  sessions.forEach(s=>{
    const b=document.createElement("div");
    b.className="tl-block";
    const y=(s.start-top)/span*gridH;
    let h=(s.end-s.start)/span*gridH;
    if(h<18) h=18;   // 太短也要看得见
    b.style.top=y+"px"; b.style.height=h+"px";
    b.style.background=colorOf(s.task.id);
    const t1=new Date(s.start), t2=new Date(s.end);
    const hm=d=>`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    b.innerHTML=`<b>${escapeHtml(s.task.text)}</b> <span class="bt">${hm(t1)}–${hm(t2)}</span>`;
    blocks.appendChild(b);
  });
  grid.appendChild(blocks);
  wrap.appendChild(grid);

  singleEl.innerHTML="";
  singleEl.appendChild(wrap);
}

// 专注分布图：扇形（环形）或条形，二选一渲染到容器
function renderChart(box, rows, totalSec){
  box.innerHTML="";
  if(chartMode==="pie"){
    const R=54, C=2*Math.PI*R, size=132;   // R + 半个描边(9) + 余量 ≤ size/2(66)，避免圆被视口切边
    let off=0;
    let segs="";
    rows.forEach(r=>{
      const frac=totalSec? r.sec/totalSec : 0;
      const len=frac*C;
      segs+=`<circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none"
        stroke="${colorOf(r.task.id)}" stroke-width="18"
        stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`;
      off+=len;
    });
    const legend=rows.map(r=>{
      const pct=totalSec? Math.round(r.sec/totalSec*100):0;
      return `<div class="lg"><span class="tl-dot" style="background:${colorOf(r.task.id)}"></span>
        <span class="nm">${escapeHtml(r.task.text)}</span>

    }).join("");
    box.innerHTML=`<div class="tl-pie-wrap">
      <div class="tl-pie">
        <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
          <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="var(--line)" stroke-width="18"/>
          ${segs}
        </svg>
        <div class="tl-pie-center"><span class="big">${fmtDur(totalSec)}</span><span class="sm">共 ${rows.length} 个任务</span></div>
      </div>
      <div class="tl-pie-legend">${legend}</div>
    </div>`;
  }else{
    const bc=document.createElement("div");
    bc.className="tl-barchart";
    rows.forEach(r=>{
      const pct=totalSec? Math.round(r.sec/totalSec*100):0;
      const col=colorOf(r.task.id);
      const row=document.createElement("div");
      row.className="tl-stat-row";
      row.innerHTML=`<div class="tl-dot" style="background:${col}"></div>
        <div class="tl-stat-body">
          <div class="tl-stat-top"><span class="nm">${escapeHtml(r.task.text)}</span><span class="mins">${fmtDur(r.sec)} · ${pct}%</span></div>
          <div class="tl-bar"><div class="tl-bar-fill" style="width:${pct}%;background:${col}"></div></div>
        </div>`;
      bc.appendChild(row);
    });
    box.appendChild(bc);
    const tot=document.createElement("div");
    tot.className="tl-total"; tot.textContent="共 "+fmtDur(totalSec)+" · "+rows.length+" 个任务";
    box.appendChild(tot);
  }
}

/* ---------- 月度概览：本月各目标铺在哪几天、哪些没动 ---------- */
// 月份工具：YYYY-MM 的天数、前后翻月、友好标题
function daysInMonth(ym){ const [y,m]=ym.split("-").map(Number); return new Date(y,m,0).getDate(); }
function shiftMonth(ym, delta){
  const [y,m]=ym.split("-").map(Number);
  const d=new Date(y, m-1+delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function fmtMonthLabel(ym){ const [y,m]=ym.split("-"); return `${y}年${Number(m)}月`; }
// 某目标在指定月的展现数据：活动日区间、状态
function monthSpanOf(task, ym){
  const dim=daysInMonth(ym);
  // 手动校准优先
  let sd=null, ed=null, manual=false;
  if(task.manualSpan && task.manualSpan.start){
    sd=task.manualSpan.start; ed=task.manualSpan.end||task.manualSpan.start; manual=true;
  }
  // 自动：从后代叶子活动日期里取落在本月的
  const inMonth=[...activeDatesOf(task)].filter(d=>d.slice(0,7)===ym).sort();
  const autoStart=inMonth[0]||null, autoEnd=inMonth[inMonth.length-1]||null;
  if(!manual){ sd=autoStart; ed=autoEnd; }
  // 完成日（若在本月）
  const doneDate = task.doneAt? dateStr(new Date(task.doneAt)) : null;
  const doneInMonth = doneDate && doneDate.slice(0,7)===ym ? doneDate : null;
  const prog=progressOf(task);
  const isDone = prog.total>0 && prog.done>=prog.total;
  const hasActivity = !!(sd || inMonth.length);
  let status = isDone ? "done" : (hasActivity ? "doing" : "idle");
  return { dim, start:sd, end:ed, manual, activeDays:inMonth, doneInMonth, isDone, status, prog,
           dayNum:d=>Number(d.slice(8,10)) };
}
function renderMonthOverview(){
  singleEl.innerHTML="";
  const wrap=document.createElement("div");
  wrap.className="mv-wrap";

  // 月份切换条（前后翻月）
  const mbar=document.createElement("div");
  mbar.className="mv-monthbar";
  mbar.innerHTML=`<div class="nav-arrow" id="mvPrev">‹</div>
    <div class="mv-month-label">${fmtMonthLabel(mvMonth)}</div>
    <div class="nav-arrow" id="mvNext">›</div>`;
  wrap.appendChild(mbar);
  mbar.querySelector("#mvPrev").onclick=()=>{ mvMonth=shiftMonth(mvMonth,-1); rerender(); };
  mbar.querySelector("#mvNext").onclick=()=>{ mvMonth=shiftMonth(mvMonth,1); rerender(); };

  const tasks=state.month.tasks||[];
  if(!tasks.length){
    const e=document.createElement("div");
    e.className="mv-empty";
    e.innerHTML='<span class="big">🗓️</span>这个月还没有目标<br>切回清单先写下这个月要推进的事';
    wrap.appendChild(e);
    singleEl.appendChild(wrap);
    return;
  }

  // 按状态分组：进行中 / 已完成 / 还没动
  const groups={doing:[],done:[],idle:[]};
  tasks.forEach(t=>groups[monthSpanOf(t,mvMonth).status].push(t));
  const order=[["doing","进行中"],["done","已完成"],["idle","还没动"]];
  order.forEach(([key,label])=>{
    if(!groups[key].length) return;
    const lb=document.createElement("div");
    lb.className="mv-group-label"; lb.textContent=`${label}（${groups[key].length}）`;
    wrap.appendChild(lb);
    groups[key].forEach(t=>wrap.appendChild(renderMvRow(t)));
  });
  singleEl.appendChild(wrap);
}
// 把活动日数组压成一句可读文字："铺在 3日、5日、8日" / "3日–10日（手动）"
function fmtSpread(info){
  if(info.manual && info.start){
    const s=info.dayNum(info.start), e=info.dayNum(info.end||info.start);
    return (s===e? `${s}日` : `${s}日 – ${e}日`)+"（手动指定）";
  }
  const days=(info.activeDays||[]).map(info.dayNum);
  if(!days.length) return "本月还没动";
  if(days.length<=4) return "铺在 "+days.map(d=>d+"日").join("、");
  const s=days[0], e=days[days.length-1];
  return `铺在 ${s}日 – ${e}日，共 ${days.length} 天`;
}
function renderMvRow(task){
  const info=monthSpanOf(task, mvMonth);
  const col=colorOf(task.id);
  const row=document.createElement("div");
  row.className="mv-row"+(info.isDone?" done":"");

  const top=document.createElement("div");
  top.className="mv-row-top";
  const badgeText={doing:"进行中",done:"已完成",idle:"还没动"}[info.status];
  top.innerHTML=`<span class="mv-color-dot" style="background:${col}"></span>
    <span class="mv-name">${escapeHtml(task.text)}</span>
    <span class="mv-badge ${info.status}">${badgeText}</span>
    <span class="mv-edit" title="校准起止日期"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>`;
  top.querySelector(".mv-edit").onclick=()=>openMvEdit(task);
  row.appendChild(top);

  const meta=document.createElement("div");
  meta.className="mv-meta";
  meta.innerHTML=`<span>${fmtSpread(info)}</span><span>${info.prog.done}/${info.prog.total} 项完成</span>`;
  row.appendChild(meta);
  return row;
}

/* ---------- 时长格式：秒 → Xh Ym / Ym ---------- */
function fmtDur(sec){
  const m=Math.round(sec/60);
  if(m<60) return m+" 分钟";
  const h=Math.floor(m/60), mm=m%60;
  return mm? `${h} 小时 ${mm} 分` : `${h} 小时`;
}

/* ---------- 时间格式 ---------- */
function fmtDue(iso){
  const d=new Date(iso), now=new Date();
  const pad=n=>String(n).padStart(2,"0");
  const sameDay=d.toDateString()===now.toDateString();
  const tmr=new Date(now); tmr.setDate(now.getDate()+1);
  const isTmr=d.toDateString()===tmr.toDateString();
  const hm=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if(sameDay) return "今天 "+hm;
  if(isTmr) return "明天 "+hm;
  return `${d.getMonth()+1}月${d.getDate()}日 ${hm}`;
}

/* ---------- 视图层级 & 拆解 ---------- */
function nextViewFor(v){ return {year:"month",month:"week",week:"day"}[v]||null; }
function breakdown(task, ownerView){
  const nv=nextViewFor(ownerView); if(!nv) return;
  dlgPrompt(`拆解为一条${VIEW_TITLE[nv]}任务`,{msg:`把「${task.text}」向下拆解`,placeholder:`这条${VIEW_TITLE[nv]}任务是…`}).then(raw=>{
    const text=(raw||"").trim();
    if(!text) return;
    const child={ id:uid(), text, done:false, createdAt:Date.now(), due:null, parentText:task.text, children:[], sessions:[] };
    if(nv==="day"){ child.date=currentDate; state.day.lists[current].tasks.push(child); }
    else{ state[nv].tasks.push(child); }
    if(!task.children) task.children=[];
    task.children.push(child.id);
    expanded[task.id]=true;   // 拆解后自动展开父节点，立即看到新子项
    save(); rerender();
  });
}

/* ---------- 添加 ---------- */
function addTask(){
  const text=inputEl.value.trim();
  if(!text) return;
  const task={ id:uid(), text, done:false, createdAt:Date.now(),
    due:(useTime&&timeInput.value)? timeInput.value : null, parentText:null, children:[], sessions:[] };
  if(view==="day") task.date=currentDate;   // 日程任务归属到当前查看的日期
  // 挂靠上级：把这条任务挂到某个更高层目标下，进度自动上卷（日/周/月均可）
  if(pendingParentId){
    const parent=taskById(pendingParentId);
    if(parent){
      task.parentText=parent.text;
      if(!parent.children) parent.children=[];
      parent.children.push(task.id);
    }
  }
  activeTasks().push(task);
  inputEl.value="";
  // 加完任务后收起时间/上级选择器，恢复干净的输入栏
  useTime=false; pickerRow.classList.remove("show"); timeBtn.classList.remove("on"); timeInput.value="";
  pendingParentId=null; syncParentHint();
  save(); rerender();
  if(view==="day" && dayMode==="list") requestAnimationFrame(()=>{ if(trackEl.children[current])trackEl.children[current].scrollTop=0; });
  else singleEl.scrollTop=0;
}

    if(!name) return;
    state.day.lists.push({name,tasks:[]});
    save(); current=state.day.lists.length-1; rerender(); goTo(current);

function layout(){ trackEl.style.transform=`translateX(${-current*100}%)`; }
function goTo(i){
  current=Math.max(0,Math.min(state.day.lists.length-1,i));
  layout(); renderTabs(); updateHeader();
  const a=tabsEl.children[current]; if(a) a.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});

const vp=document.getElementById("viewport");
let startX=0,startY=0,deltaX=0,dragging=false,horizontal=null;
vp.addEventListener("touchstart",e=>{
  if(view!=="day"||dayMode!=="list") return;
  const t=e.touches[0]; startX=t.clientX; startY=t.clientY; deltaX=0; dragging=true; horizontal=null;
  trackEl.style.transition="none";
},{passive:true});
vp.addEventListener("touchmove",e=>{
  if(!dragging||view!=="day"||dayMode!=="list") return;
  const t=e.touches[0], dx=t.clientX-startX, dy=t.clientY-startY;
  if(horizontal===null) horizontal=Math.abs(dx)>Math.abs(dy)+4;
  if(!horizontal) return;
  e.preventDefault(); deltaX=dx;
  if((current===0&&dx>0)||(current===state.day.lists.length-1&&dx<0)) deltaX=dx*0.3;
  trackEl.style.transform=`translateX(${-current*100 + (deltaX/vp.clientWidth)*100}%)`;
},{passive:false});
vp.addEventListener("touchend",()=>{
  if(!dragging||view!=="day"){ dragging=false; return; }
  dragging=false; trackEl.style.transition="";
  if(horizontal && Math.abs(deltaX)>vp.clientWidth*0.22) goTo(current+(deltaX<0?1:-1));
  else layout();
},{passive:true});

/* ---------- 底部导航切换 ---------- */
function switchView(v){
  view=v;
  [...navEl.children].forEach(it=>it.classList.toggle("active",it.dataset.view===v));
  inputEl.placeholder=VIEW_PLACEHOLDER[v];
  // 挂靠上级按钮：日/周/月都可挂到更高层，年度目标已是顶层则隐藏
  parentBtn.style.display = (PARENT_GROUPS[v]&&PARENT_GROUPS[v].length) ? "flex" : "none";
  pendingParentId=null;   // 切层后原上级可能已不合法，重置
  syncParentHint();
  rerender();
}
navEl.querySelectorAll(".nav-item").forEach(it=>{
  it.onclick=()=>switchView(it.dataset.view);
});

/* ---------- 日期轴：前后翻天 / 直接选日期 ---------- */
function goToDate(str){
  currentDate=str;
  rerender();
  requestAnimationFrame(()=>{ if(trackEl.children[current]) trackEl.children[current].scrollTop=0; });
}
datePrevEl.onclick=()=>goToDate(shiftDate(currentDate,-1));
dateNextEl.onclick=()=>goToDate(shiftDate(currentDate,1));
// 点日期文字：展开月历弹层，可翻月 + 点日期跳转
dateLabelEl.onclick=()=>openCalendar();
datePickerEl.onchange=()=>{ if(datePickerEl.value) goToDate(datePickerEl.value); };

/* ---------- 月历弹层 ---------- */
let calCursor = currentDate;   // 月历当前显示的月份（取该月任意一天）
// 统计某天各清单里有多少任务，用于日历圆点
function dayHasTasks(str){
  return state.day.lists.some(l => (l.tasks||[]).some(t => t.date===str));
}
function renderCalendar(){
  const cur=new Date(calCursor+"T00:00:00");
  const y=cur.getFullYear(), m=cur.getMonth();
  calTitleEl.textContent=`${y}年${m+1}月`;
  const first=new Date(y,m,1);
  const startDow=first.getDay();               // 本月1号是周几
  const daysInMonth=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();    // 上月天数
  const today=todayStr();
  calGridEl.innerHTML="";
  const cells=[];
  // 上月补白
  for(let i=startDow-1;i>=0;i--) cells.push({d:prevDays-i, mm:m-1, yy:y, other:true});
  // 本月
  for(let d=1;d<=daysInMonth;d++) cells.push({d, mm:m, yy:y, other:false});
  // 下月补白，凑满整行
  while(cells.length%7!==0) cells.push({d:cells.length-startDow-daysInMonth+1, mm:m+1, yy:y, other:true});
  cells.forEach(c=>{
    const cd=new Date(c.yy, c.mm, c.d);
    const str=dateStr(cd);
    const cell=document.createElement("div");
    cell.className="cal-cell"+(c.other?" other":"")+(str===today?" today":"")+(str===currentDate?" sel":"");
    cell.textContent=c.d;
    if(dayHasTasks(str)){ const dot=document.createElement("div"); dot.className="cal-dot"; cell.appendChild(dot); }
    cell.onclick=()=>{ closeCalendar(); goToDate(str); };
    calGridEl.appendChild(cell);
  });
}
function openCalendar(){ calCursor=currentDate; renderCalendar(); calMaskEl.classList.add("show"); }
function closeCalendar(){ calMaskEl.classList.remove("show"); }
calPrevEl.onclick=()=>{ const d=new Date(calCursor+"T00:00:00"); d.setMonth(d.getMonth()-1); calCursor=dateStr(d); renderCalendar(); };
calNextEl.onclick=()=>{ const d=new Date(calCursor+"T00:00:00"); d.setMonth(d.getMonth()+1); calCursor=dateStr(d); renderCalendar(); };
calTodayEl.onclick=()=>{ closeCalendar(); goToDate(todayStr()); };
calMaskEl.onclick=(e)=>{ if(e.target===calMaskEl) closeCalendar(); };

/* ---------- 键盘（桌面预览） ---------- */
window.addEventListener("keydown",e=>{
  if(document.activeElement===inputEl||document.activeElement===timeInput) return;
  if(view==="day"&&dayMode==="list"){ if(e.key==="ArrowRight")goTo(current+1); if(e.key==="ArrowLeft")goTo(current-1); }
});

/* ---------- 番茄钟计时 ---------- */
let timerState=null;   // { taskId, durationMin, startedAt, accumBeforePauseSec, paused } | null
let timerTick=null;    // setInterval 句柄
const MIN_LEN=5, MAX_LEN=120;

function loadTimer(){
  try{ const raw=localStorage.getItem(TIMER_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function persistTimer(){
  try{ timerState? localStorage.setItem(TIMER_KEY, JSON.stringify(timerState)) : localStorage.removeItem(TIMER_KEY); }catch(e){}
}
// 已专注秒数：暂停时只算到暂停前累计；运行时再加上本段
function elapsedSec(){
  if(!timerState) return 0;
  let s=timerState.accumBeforePauseSec||0;
  if(!timerState.paused && timerState.startedAt) s += Math.floor((Date.now()-timerState.startedAt)/1000);
  return s;
}
function remainSec(){ return Math.max(0, timerState.durationMin*60 - elapsedSec()); }

function openTimer(task){
  timerState = loadTimer();
  // 若已有别的任务在计时，优先恢复那个；否则给当前任务新建一个待开始的计时
  if(!timerState || timerState.taskId!==task.id){
    if(timerState){ /* 有进行中的其它计时，先不覆盖，直接恢复展示它 */ }
    else timerState = { taskId:task.id, durationMin:25, startedAt:null, accumBeforePauseSec:0, paused:true };
  }
  persistTimer();
  timerMaskEl.classList.add("show");
  refreshTimerUI();
  startTick();
}
function closeTimer(){ timerMaskEl.classList.remove("show"); stopTick(); }
function startTick(){ stopTick(); timerTick=setInterval(refreshTimerUI, 1000); }
function stopTick(){ if(timerTick){ clearInterval(timerTick); timerTick=null; } }

function refreshTimerUI(){
  if(!timerState){ closeTimer(); return; }
  const task=taskById(timerState.taskId);
  timerTaskEl.textContent = task? task.text : "任务";
  const running = !timerState.paused && timerState.startedAt;
  const notStarted = !timerState.startedAt && timerState.paused;
  const rem=remainSec();
  const mm=String(Math.floor(rem/60)).padStart(2,"0");
  const ss=String(rem%60).padStart(2,"0");
  timerClockEl.textContent=`${mm}:${ss}`;
  timerLenEl.textContent=timerState.durationMin+" 分钟";
  // 时长只在"还没开始"时可调
  timerAdjustEl.style.opacity = notStarted? "1":".4";
  timerMinusEl.classList.toggle("disabled", !notStarted);
  timerPlusEl.classList.toggle("disabled", !notStarted);
  // 按钮态
  if(notStarted){
    timerMainEl.textContent="开始专注"; timerMainEl.style.display="";
    timerDoneEl.style.display="none";
    timerSubEl.textContent="专注一段，别被打断";
  }else if(running){
    timerMainEl.textContent="暂停"; timerMainEl.style.display="";
    timerDoneEl.style.display="";
    timerSubEl.textContent="专注中…";
  }else{ // 暂停中
    timerMainEl.textContent="继续"; timerMainEl.style.display="";
    timerDoneEl.style.display="";
    timerSubEl.textContent="已暂停 · 已专注 "+fmtDur(elapsedSec());
  }
  // 倒计时归零 → 自动结束记录
  if(running && rem<=0){ finishTimer(true); }
}
function adjustLen(delta){
  if(!timerState || timerState.startedAt) return;
  timerState.durationMin=Math.min(MAX_LEN, Math.max(MIN_LEN, timerState.durationMin+delta));
  persistTimer(); refreshTimerUI();
}
timerMinusEl.onclick=()=>adjustLen(-5);
timerPlusEl.onclick=()=>adjustLen(5);

timerMainEl.onclick=()=>{
  if(!timerState) return;
  if(!timerState.startedAt){                 // 开始
    timerState.startedAt=Date.now(); timerState.paused=false;
  }else if(timerState.paused){                // 继续
    timerState.startedAt=Date.now(); timerState.paused=false;
  }else{                                      // 暂停：累计已专注秒数
    timerState.accumBeforePauseSec=elapsedSec(); timerState.paused=true; timerState.startedAt=null;
  }
  persistTimer(); refreshTimerUI();
};
// 结束并记录一段专注
function finishTimer(auto){
  if(!timerState){ closeTimer(); return; }
  const task=taskById(timerState.taskId);
  const focusSec=elapsedSec();
  if(task && focusSec>=30){   // 太短(<30秒)不记，避免误触
    if(!task.sessions) task.sessions=[];
    const end=Date.now();
    task.sessions.push({ start:end-focusSec*1000, end, focusSec });
    save();
  }
  timerState=null; persistTimer(); closeTimer(); rerender();
  if(auto && navigator.vibrate) try{ navigator.vibrate(200); }catch(e){}
}
timerDoneEl.onclick=()=>finishTimer(false);
timerGiveupEl.onclick=()=>{
  if(!timerState) return closeTimer();
  const started=!!timerState.startedAt;
  if(!started){ timerState=null; persistTimer(); closeTimer(); rerender(); return; }
  dlgConfirm("已进行的时间不会被记录。",{title:"放弃这段专注？",okLabel:"放弃",danger:true}).then(ok=>{
    if(!ok) return;
    timerState=null; persistTimer(); closeTimer(); rerender();
  });
};
timerMaskEl.onclick=(e)=>{ if(e.target===timerMaskEl) closeTimer(); };  // 点空白只收起，不丢弃计时

/* ---------- 启动 ---------- */
switchView("day");
// 若有未结束的番茄钟（刷新/切后台回来），自动恢复浮层
(function resumeTimer(){
  const t=loadTimer();
  if(t && taskById(t.taskId)){
    timerState=t;
    timerMaskEl.classList.add("show");
    refreshTimerUI(); startTick();
  }
})();

/* ---------- 备份：导出 / 导入 ---------- */
function exportData(){
  const payload={ app:"stepping", version:3, exportedAt:new Date().toISOString(), state };
  const json=JSON.stringify(payload,null,2);
  const pad=n=>String(n).padStart(2,"0");
  const d=new Date();
  const fname=`步步备份-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  try{
    const blob=new Blob([json],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){
    // 某些手机浏览器下载受限：退化为复制到剪贴板
    try{ navigator.clipboard.writeText(json); dlgAlert("已复制备份内容到剪贴板，粘贴到备忘录/文件保存即可。"); }
    catch(_){ dlgAlert("自动复制失败，请在导出的文件里手动保存。"); }
  }
}
function importData(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=async ()=>{
      try{
        const d=JSON.parse(r.result);
        const incoming = d && d.state && d.state.day ? d.state : (d && d.day ? d : null);
        if(!incoming) throw new Error("格式不符");
        const ok=await dlgConfirm("这会覆盖当前所有任务，建议先导出当前数据做备份。",{title:"导入并覆盖？",okLabel:"覆盖导入",danger:true});
        if(!ok) return;
        state=incoming;
        if(!save()) return;
        expanded={}; current=0;
        switchView("day");
        dlgAlert("数据已恢复。","✅ 导入成功");
      }catch(e){ dlgAlert("文件格式不正确，请选择本应用导出的备份文件。","❌ 导入失败"); }
    };
    r.readAsText(f);
  };
  inp.click();
}
document.getElementById("backupBtn").onclick=()=>{
  _openDialog({title:"备份 / 恢复",buttons:[
    {label:"导出备份文件",style:"ghost",value:"export"},
    {label:"从备份文件恢复",style:"ghost",value:"import"},
    {label:"取消",style:"ghost",value:null},
  ]}).then(c=>{
    if(c==="export") exportData();
    else if(c==="import") importData();
  });
};

/* ---------- PWA：让它能"装"到手机桌面、离线打开 ---------- */
(function setupPWA(){
  // 用 http(s) 打开时注册 Service Worker，支持离线；file:// 直接打开则跳过
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").then((reg)=>{
      // 发现新版本 SW 就绪后，等它接管再自动刷新一次，用户无需手动清缓存
      reg.addEventListener("updatefound", ()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", ()=>{
          // 新 SW 装好且已有旧 SW 在控制页面 → 说明是"更新"，让它立即接管
          if(nw.state === "installed" && navigator.serviceWorker.controller){
            nw.postMessage("skip-waiting");
          }
        });
      });
      // 每次打开检查一次更新
      reg.update();
    }).catch(()=>{});
    // 新 SW 接管后自动刷新一次（只刷一次，避免死循环）
    let refreshed = false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{
      if(refreshed) return;
      refreshed = true;
      location.reload();
    });
  }
})();
</script>
