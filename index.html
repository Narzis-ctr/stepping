/* ---------- 新建 / 编辑习惯 ---------- */
const habitMaskEl=document.getElementById("habitMask");
const hbTitleEl=document.getElementById("habitTitle");
let hbEditing=null;        // 正在编辑的习惯（null=新建）
let hbFreq="daily", hbPer=1, hbN=3, hbDaysSel=new Set();
function hbSyncFields(){
  document.querySelectorAll("#hbFreqSeg .seg").forEach(s=>s.classList.toggle("on", s.dataset.freq===hbFreq));
  document.getElementById("hbPerDayWrap").classList.toggle("hidden", hbFreq!=="daily");
  const nWrap=document.getElementById("hbNWrap");
  nWrap.classList.toggle("hidden", !(hbFreq==="weekN"||hbFreq==="monthN"));
  document.getElementById("hbNLabel").textContent = hbFreq==="weekN"?"每周几次":"每月几次";
  document.getElementById("hbDaysWrap").classList.toggle("hidden", hbFreq!=="days");
  document.getElementById("hbPerVal").textContent=hbPer;
  document.getElementById("hbNVal").textContent=hbN;
  document.querySelectorAll("#hbDays .d").forEach(d=>d.classList.toggle("on", hbDaysSel.has(d.dataset.d)));
  // 自动目标提示
  const probe=hbBuildFreq();
  const tmp={freq:probe, perDay:hbPer};
  document.getElementById("hbAutoHint").textContent=
    `留空则自动：本周约 ${habitAutoWeek(tmp)} 次 · 本月约 ${habitAutoMonth(tmp)} 次 · 今年约 ${habitAutoYear(tmp)} 次`;
}
function hbBuildFreq(){
  if(hbFreq==="daily") return "daily";
  if(hbFreq==="weekN") return "week"+hbN;
  if(hbFreq==="monthN") return "month"+hbN;
  if(hbFreq==="days"){ const arr=[...hbDaysSel]; return "days:"+(arr.length?arr.join(","):"1"); }
  return "daily";
}
function openHabitDialog(habit){
  hbEditing=habit||null;
  hbTitleEl.textContent=habit?"编辑习惯":"新建习惯";
  document.getElementById("habitDelete").classList.toggle("hidden", !habit);
  // 回填
  document.getElementById("hbText").value=habit?habit.text:"";
  hbPer=habit&&habit.perDay?habit.perDay:1; hbN=3; hbDaysSel=new Set();
  const f=habit?habit.freq:"daily";
  if(f==="daily") hbFreq="daily";
  else if(/^week\d+$/.test(f)){ hbFreq="weekN"; hbN=Number(f.slice(4)); }
  else if(/^month\d+$/.test(f)){ hbFreq="monthN"; hbN=Number(f.slice(5)); }
  else if(/^days:/.test(f)){ hbFreq="days"; f.slice(5).split(",").filter(x=>x!=="").forEach(x=>hbDaysSel.add(x)); }
  else hbFreq="daily";
  document.getElementById("hbWeek").value = habit&&habit.weekTarget?habit.weekTarget:"";
  document.getElementById("hbMonth").value = habit&&habit.monthTarget?habit.monthTarget:"";
  document.getElementById("hbYear").value = habit&&habit.yearTarget?habit.yearTarget:"";
  hbSyncFields();
  habitMaskEl.classList.add("show");
  setTimeout(()=>document.getElementById("hbText").focus(),80);
}
function closeHabitDialog(){ habitMaskEl.classList.remove("show"); }
function editHabit(habit){ openHabitDialog(habit); }
function saveHabit(){
  const text=document.getElementById("hbText").value.trim();
  if(!text){ document.getElementById("hbText").focus(); return; }
  const freq=hbBuildFreq();
  const numOrNull=id=>{ const v=parseInt(document.getElementById(id).value,10); return (Number.isFinite(v)&&v>0)?v:null; };
  const per = freq==="daily"? hbPer : 1;
  const data={ text, freq, perDay:per,
    weekTarget:numOrNull("hbWeek"), monthTarget:numOrNull("hbMonth"), yearTarget:numOrNull("hbYear") };
  if(hbEditing){ Object.assign(hbEditing, data); }
  else{ (state.habits ||= []).push(Object.assign({ id:uid(), checkins:[] }, data)); }
  save(); closeHabitDialog(); rerender();
}
function deleteHabit(){
  if(!hbEditing) return;
  dlgConfirm(`「${hbEditing.text}」的所有打卡记录会一并删除。`,{title:"删除这个习惯？",okLabel:"删除",danger:true}).then(ok=>{
    if(!ok) return;
    state.habits=(state.habits||[]).filter(h=>h!==hbEditing);
    save(); closeHabitDialog(); rerender();
  });
}
document.getElementById("habitBtn").onclick=()=>openHabitDialog(null);
document.getElementById("habitClose").onclick=closeHabitDialog;
document.getElementById("habitSave").onclick=saveHabit;
document.getElementById("habitDelete").onclick=deleteHabit;
habitMaskEl.onclick=(e)=>{ if(e.target===habitMaskEl) closeHabitDialog(); };
document.querySelectorAll("#hbFreqSeg .seg").forEach(s=> s.onclick=()=>{ hbFreq=s.dataset.freq; hbSyncFields(); });
document.getElementById("hbPerMinus").onclick=()=>{ hbPer=Math.max(1,hbPer-1); hbSyncFields(); };
document.getElementById("hbPerPlus").onclick=()=>{ hbPer=Math.min(50,hbPer+1); hbSyncFields(); };
document.getElementById("hbNMinus").onclick=()=>{ hbN=Math.max(1,hbN-1); hbSyncFields(); };

function layout(){ trackEl.style.transform=`translateX(${-current*100}%)`; }
function goTo(i){

const vp=document.getElementById("viewport");
let startX=0,startY=0,deltaX=0,dragging=false,horizontal=null;
vp.addEventListener("touchstart",e=>{
  if(view!=="day"||dayMode!=="list") return;
  const t=e.touches[0]; startX=t.clientX; startY=t.clientY; deltaX=0; dragging=true; horizontal=null;
  trackEl.style.transition="none";
},{passive:true});
vp.addEventListener("touchmove",e=>{
  if(!dragging||view!=="day"||dayMode!=="list") return;
  const t=e.touches[0], dx=t.clientX-startX, dy=t.clientY-startY;
  if(horizontal===null) horizontal=Math.abs(dx)>Math.abs(dy)+4;
  if(!horizontal) return;
  e.preventDefault(); deltaX=dx;
  if((current===0&&dx>0)||(current===state.day.lists.length-1&&dx<0)) deltaX=dx*0.3;
  trackEl.style.transform=`translateX(${-current*100 + (deltaX/vp.clientWidth)*100}%)`;
},{passive:false});
vp.addEventListener("touchend",()=>{
  if(!dragging||view!=="day"){ dragging=false; return; }
  dragging=false; trackEl.style.transition="";
  if(horizontal && Math.abs(deltaX)>vp.clientWidth*0.22) goTo(current+(deltaX<0?1:-1));
  else layout();
},{passive:true});

/* ---------- 底部导航切换 ---------- */
function switchView(v){
  view=v;
  [...navEl.children].forEach(it=>it.classList.toggle("active",it.dataset.view===v));
  inputEl.placeholder=VIEW_PLACEHOLDER[v];
  // 挂靠上级按钮：日/周/月都可挂到更高层，年度目标已是顶层则隐藏
  parentBtn.style.display = (PARENT_GROUPS[v]&&PARENT_GROUPS[v].length) ? "flex" : "none";
  pendingParentId=null;   // 切层后原上级可能已不合法，重置
  syncParentHint();
  rerender();
}
navEl.querySelectorAll(".nav-item").forEach(it=>{
  it.onclick=()=>switchView(it.dataset.view);
});

/* ---------- 日期轴：前后翻天 / 直接选日期 ---------- */
function goToDate(str){
  currentDate=str;
  rerender();
  requestAnimationFrame(()=>{ if(trackEl.children[current]) trackEl.children[current].scrollTop=0; });
}
datePrevEl.onclick=()=>goToDate(shiftDate(currentDate,-1));
dateNextEl.onclick=()=>goToDate(shiftDate(currentDate,1));
// 点日期文字：展开月历弹层，可翻月 + 点日期跳转
dateLabelEl.onclick=()=>openCalendar();

/* ---------- 月历弹层 ---------- */
let calCursor = currentDate;   // 月历当前显示的月份（取该月任意一天）
// 统计某天各清单里有多少任务，用于日历圆点
function dayHasTasks(str){
  return state.day.lists.some(l => (l.tasks||[]).some(t => taskDay(t)===str));
}
function renderCalendar(){
  const cur=new Date(calCursor+"T00:00:00");
  const y=cur.getFullYear(), m=cur.getMonth();
  calTitleEl.textContent=`${y}年${m+1}月`;
  const first=new Date(y,m,1);
  const startDow=first.getDay();               // 本月1号是周几
  const daysInMonth=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();    // 上月天数
  const today=todayStr();
  calGridEl.innerHTML="";
  const cells=[];
  // 上月补白
  for(let i=startDow-1;i>=0;i--) cells.push({d:prevDays-i, mm:m-1, yy:y, other:true});
  // 本月
  for(let d=1;d<=daysInMonth;d++) cells.push({d, mm:m, yy:y, other:false});
  // 下月补白，凑满整行
  while(cells.length%7!==0) cells.push({d:cells.length-startDow-daysInMonth+1, mm:m+1, yy:y, other:true});
  cells.forEach(c=>{
    const cd=new Date(c.yy, c.mm, c.d);
    const str=dateStr(cd);
    const cell=document.createElement("div");
    cell.className="cal-cell"+(c.other?" other":"")+(str===today?" today":"")+(str===currentDate?" sel":"");
    cell.textContent=c.d;
    if(dayHasTasks(str)){ const dot=document.createElement("div"); dot.className="cal-dot"; cell.appendChild(dot); }
    cell.onclick=()=>{ closeCalendar(); goToDate(str); };
    calGridEl.appendChild(cell);
  });
}
function openCalendar(){ calCursor=currentDate; renderCalendar(); calMaskEl.classList.add("show"); }
function closeCalendar(){ calMaskEl.classList.remove("show"); }
calPrevEl.onclick=()=>{ const d=new Date(calCursor+"T00:00:00"); d.setMonth(d.getMonth()-1); calCursor=dateStr(d); renderCalendar(); };
calNextEl.onclick=()=>{ const d=new Date(calCursor+"T00:00:00"); d.setMonth(d.getMonth()+1); calCursor=dateStr(d); renderCalendar(); };
calTodayEl.onclick=()=>{ closeCalendar(); goToDate(todayStr()); };
calMaskEl.onclick=(e)=>{ if(e.target===calMaskEl) closeCalendar(); };

/* ---------- 键盘（桌面预览） ---------- */
window.addEventListener("keydown",e=>{
  if(document.activeElement===inputEl) return;
  if(view==="day"&&dayMode==="list"){ if(e.key==="ArrowRight")goTo(current+1); if(e.key==="ArrowLeft")goTo(current-1); }
});

/* ---------- 应用内日期时间选择器（替代原生 type=date / datetime-local） ---------- */
// 用法：openDatePicker({value, withTime, title}).then(result => ...)
// value: "YYYY-MM-DD" 或 "YYYY-MM-DDTHH:mm" 或 ""; 返回同格式字符串，或 null(清除)，或 undefined(取消)
const dtMaskEl=document.getElementById("dtMask");
const dtTitleEl=document.getElementById("dtTitle");
const dtMonthLabelEl=document.getElementById("dtMonthLabel");
const dtGridEl=document.getElementById("dtGrid");
const dtHoursEl=document.getElementById("dtHours");
const dtMinsEl=document.getElementById("dtMins");
const dtTimeSectionEl=document.getElementById("dtTimeSection");
const dtPrevEl=document.getElementById("dtPrev");
const dtNextEl=document.getElementById("dtNext");
const dtClearEl=document.getElementById("dtClear");
const dtOkEl=document.getElementById("dtOk");
let _dtResolve=null, _dtCursor="", _dtSel="", _dtHour=9, _dtMin=0, _dtWithTime=false;

function openDatePicker(opts={}){
  return new Promise(resolve=>{
    _dtResolve=resolve;
    _dtWithTime=!!opts.withTime;
    dtTitleEl.textContent=opts.title||(_dtWithTime?"选择日期与时间":"选择日期");
    dtTimeSectionEl.style.display=_dtWithTime?"block":"none";
    const v=opts.value||"";
    if(v){
      _dtSel=v.slice(0,10);
      if(_dtWithTime && v.length>=16){ _dtHour=Number(v.slice(11,13)); _dtMin=Number(v.slice(14,16)); }
      else { _dtHour=9; _dtMin=0; }
    }else{
      _dtSel=todayStr();
      const d=new Date(); _dtHour=(d.getHours()+1)%24; _dtMin=0;
    }
    _dtCursor=_dtSel;
    renderDtGrid(); renderDtTime();
    dtMaskEl.classList.add("show");
  });
}
function closeDatePicker(val){
  dtMaskEl.classList.remove("show");
  const r=_dtResolve; _dtResolve=null;
  if(r) r(val);
}
function renderDtGrid(){
  const cur=new Date(_dtCursor+"T00:00:00");
  const y=cur.getFullYear(), m=cur.getMonth();
  dtMonthLabelEl.textContent=`${y}年${m+1}月`;
  const startDow=new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const today=todayStr();
  dtGridEl.innerHTML="";
  const cells=[];
  for(let i=startDow-1;i>=0;i--) cells.push({d:prevDays-i, mm:m-1, yy:y, other:true});
  for(let d=1;d<=dim;d++) cells.push({d, mm:m, yy:y, other:false});
  while(cells.length%7!==0) cells.push({d:cells.length-startDow-dim+1, mm:m+1, yy:y, other:true});
  cells.forEach(c=>{
    const cd=new Date(c.yy, c.mm, c.d);
    const str=dateStr(cd);
    const cell=document.createElement("div");
    cell.className="cal-cell"+(c.other?" other":"")+(str===today?" today":"")+(str===_dtSel?" sel":"");
    cell.textContent=c.d;
    cell.onclick=()=>{ _dtSel=str; renderDtGrid(); };
    dtGridEl.appendChild(cell);
  });
}
function renderDtTime(){
  if(!_dtWithTime) return;
  dtHoursEl.innerHTML=""; dtMinsEl.innerHTML="";
  for(let h=0;h<24;h++){
    const c=document.createElement("div");
    c.className="dt-cell"+(h===_dtHour?" sel":""); c.textContent=pad2(h);
    c.onclick=()=>{ _dtHour=h; renderDtTime(); };
    dtHoursEl.appendChild(c);
  }
  for(let mm=0;mm<60;mm+=5){
    const c=document.createElement("div");
    c.className="dt-cell"+(mm===_dtMin?" sel":""); c.textContent=pad2(mm);
    c.onclick=()=>{ _dtMin=mm; renderDtTime(); };
    dtMinsEl.appendChild(c);
  }
  // 选中项滚动到可见
  requestAnimationFrame(()=>{
    const hs=dtHoursEl.querySelector(".sel"), ms=dtMinsEl.querySelector(".sel");
    if(hs) dtHoursEl.scrollLeft=hs.offsetLeft-dtHoursEl.clientWidth/2+hs.clientWidth/2;
    if(ms) dtMinsEl.scrollLeft=ms.offsetLeft-dtMinsEl.clientWidth/2+ms.clientWidth/2;
  });
}
dtPrevEl.onclick=()=>{ const d=new Date(_dtCursor+"T00:00:00"); d.setMonth(d.getMonth()-1); _dtCursor=dateStr(d); renderDtGrid(); };
dtNextEl.onclick=()=>{ const d=new Date(_dtCursor+"T00:00:00"); d.setMonth(d.getMonth()+1); _dtCursor=dateStr(d); renderDtGrid(); };
dtClearEl.onclick=()=>closeDatePicker(null);
dtOkEl.onclick=()=>{
  if(!_dtSel){ closeDatePicker(null); return; }
  closeDatePicker(_dtWithTime ? `${_dtSel}T${pad2(_dtHour)}:${pad2(_dtMin)}` : _dtSel);
};
dtMaskEl.onclick=(e)=>{ if(e.target===dtMaskEl) closeDatePicker(undefined); };

// 编辑某个任务的截止时间（点卡片上的时间 chip 或"＋时间"触发）
function editTaskDue(task){
  openDatePicker({ value:task.due||"", withTime:true, title:"设置任务时间" }).then(res=>{
    if(res===undefined) return;   // 取消
    task.due = res;               // 具体时间 或 null(清除)
    save(); rerender();
  });
}

/* ---------- 番茄钟计时 ---------- */
let timerState=null;   // { taskId, durationMin, startedAt, accumBeforePauseSec, paused } | null
let timerTick=null;    // setInterval 句柄
const MIN_LEN=5, MAX_LEN=120;

function loadTimer(){
  try{ const raw=localStorage.getItem(TIMER_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function persistTimer(){
  try{ timerState? localStorage.setItem(TIMER_KEY, JSON.stringify(timerState)) : localStorage.removeItem(TIMER_KEY); }catch(e){}
}
// 已专注秒数：暂停时只算到暂停前累计；运行时再加上本段
function elapsedSec(){
  if(!timerState) return 0;
  let s=timerState.accumBeforePauseSec||0;
  if(!timerState.paused && timerState.startedAt) s += Math.floor((Date.now()-timerState.startedAt)/1000);
  return s;
}
function remainSec(){ return Math.max(0, timerState.durationMin*60 - elapsedSec()); }

function openTimer(task){
  timerState = loadTimer();
  // 若已有别的任务在计时，优先恢复那个；否则给当前任务新建一个待开始的计时
  if(!timerState || timerState.taskId!==task.id){
    if(timerState){ /* 有进行中的其它计时，先不覆盖，直接恢复展示它 */ }
    else timerState = { taskId:task.id, durationMin:25, startedAt:null, accumBeforePauseSec:0, paused:true };
  }
  persistTimer();
  timerMaskEl.classList.add("show");
  refreshTimerUI();
  startTick();
}
function closeTimer(){ timerMaskEl.classList.remove("show"); stopTick(); }
function startTick(){ stopTick(); timerTick=setInterval(refreshTimerUI, 1000); }
function stopTick(){ if(timerTick){ clearInterval(timerTick); timerTick=null; } }

function refreshTimerUI(){
  if(!timerState){ closeTimer(); return; }
  const task=taskById(timerState.taskId);
  timerTaskEl.textContent = task? task.text : "任务";
  const running = !timerState.paused && timerState.startedAt;
  const notStarted = !timerState.startedAt && timerState.paused;
  const rem=remainSec();
  const mm=String(Math.floor(rem/60)).padStart(2,"0");
  const ss=String(rem%60).padStart(2,"0");
  timerClockEl.textContent=`${mm}:${ss}`;
  timerLenEl.textContent=timerState.durationMin+" 分钟";
  // 时长只在"还没开始"时可调
  timerAdjustEl.style.opacity = notStarted? "1":".4";
  timerMinusEl.classList.toggle("disabled", !notStarted);
  timerPlusEl.classList.toggle("disabled", !notStarted);
  // 按钮态
  if(notStarted){
    timerMainEl.textContent="开始专注"; timerMainEl.style.display="";
    timerDoneEl.style.display="none";
    timerSubEl.textContent="专注一段，别被打断";
  }else if(running){
    timerMainEl.textContent="暂停"; timerMainEl.style.display="";
    timerDoneEl.style.display="";
    timerSubEl.textContent="专注中…";
  }else{ // 暂停中
    timerMainEl.textContent="继续"; timerMainEl.style.display="";
    timerDoneEl.style.display="";
    timerSubEl.textContent="已暂停 · 已专注 "+fmtDur(elapsedSec());
  }
  // 倒计时归零 → 自动结束记录
  if(running && rem<=0){ finishTimer(true); }
}
function adjustLen(delta){
  if(!timerState || timerState.startedAt) return;
  timerState.durationMin=Math.min(MAX_LEN, Math.max(MIN_LEN, timerState.durationMin+delta));
  persistTimer(); refreshTimerUI();
}
timerMinusEl.onclick=()=>adjustLen(-5);
timerPlusEl.onclick=()=>adjustLen(5);

timerMainEl.onclick=()=>{
  if(!timerState) return;
  if(!timerState.startedAt){                 // 开始
    timerState.startedAt=Date.now(); timerState.paused=false;
  }else if(timerState.paused){                // 继续
    timerState.startedAt=Date.now(); timerState.paused=false;
  }else{                                      // 暂停：累计已专注秒数
    timerState.accumBeforePauseSec=elapsedSec(); timerState.paused=true; timerState.startedAt=null;
  }
  persistTimer(); refreshTimerUI();
};
// 结束并记录一段专注
function finishTimer(auto){
  if(!timerState){ closeTimer(); return; }
  const task=taskById(timerState.taskId);
  const focusSec=elapsedSec();
  if(task && focusSec>=30){   // 太短(<30秒)不记，避免误触
    if(!task.sessions) task.sessions=[];
    const end=Date.now();
    task.sessions.push({ start:end-focusSec*1000, end, focusSec });
    save();
  }
  timerState=null; persistTimer(); closeTimer(); rerender();
  if(auto && navigator.vibrate) try{ navigator.vibrate(200); }catch(e){}
}
timerDoneEl.onclick=()=>finishTimer(false);

// 补记一段专注：手动填写分钟数，直接写入 task.sessions（无需真的计时）
async function addManualSession(task){
  const raw=await dlgPrompt("补记专注时长",{msg:`给「${task.text}」补一段已经完成的专注`,placeholder:"分钟数，如 25",value:""});
  if(raw===undefined || raw===null) return;
  const min=Math.round(Number(String(raw).trim()));
  if(!Number.isFinite(min) || min<=0){ dlgAlert("请输入一个正整数分钟数。"); return; }
  if(min>1440){ dlgAlert("单段专注不超过 24 小时（1440 分钟）。"); return; }
  // 落在当前查看日期的当下时刻，往前推 min 分钟作为开始
  const now=new Date();
  const [y,m,d]=currentDate.split("-").map(Number);
  const end=new Date(y,m-1,d, now.getHours(), now.getMinutes(), now.getSeconds()).getTime();
  const focusSec=min*60;
  if(!task.sessions) task.sessions=[];
  task.sessions.push({ start:end-focusSec*1000, end, focusSec, manual:true });
  save(); rerender();
}

timerGiveupEl.onclick=()=>{
  if(!timerState) return closeTimer();
  const started=!!timerState.startedAt;
  if(!started){ timerState=null; persistTimer(); closeTimer(); rerender(); return; }
  dlgConfirm("已进行的时间不会被记录。",{title:"放弃这段专注？",okLabel:"放弃",danger:true}).then(ok=>{
    if(!ok) return;
    timerState=null; persistTimer(); closeTimer(); rerender();
  });
};
timerMaskEl.onclick=(e)=>{ if(e.target===timerMaskEl) closeTimer(); };  // 点空白只收起，不丢弃计时

// 离开软件（切后台/锁屏/切标签）时自动暂停，避免"人不在了还一直计时"
// 回来时停在离开那一刻，用户手动点"继续"才接着走
function pauseTimerIfRunning(){
  if(timerState && !timerState.paused && timerState.startedAt){
    timerState.accumBeforePauseSec=elapsedSec();
    timerState.paused=true; timerState.startedAt=null;
    persistTimer(); refreshTimerUI();
  }
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden) pauseTimerIfRunning(); });
window.addEventListener("pagehide", pauseTimerIfRunning);
window.addEventListener("blur", ()=>{ /* 切窗口也暂停；桌面误触发影响小 */ pauseTimerIfRunning(); });

/* ---------- 启动 ---------- */
switchView("day");
// 若有未结束的番茄钟（刷新/切后台回来），自动恢复浮层
(function resumeTimer(){
  const t=loadTimer();
  if(t && taskById(t.taskId)){
    timerState=t;
    timerMaskEl.classList.add("show");
    refreshTimerUI(); startTick();
  }
})();

/* ---------- 备份：导出 / 导入 ---------- */
function exportData(){
  const payload={ app:"stepping", version:3, exportedAt:new Date().toISOString(), state };
  const json=JSON.stringify(payload,null,2);
  const pad=n=>String(n).padStart(2,"0");
  const d=new Date();
  const fname=`步步备份-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  try{
    const blob=new Blob([json],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){
    // 某些手机浏览器下载受限：退化为复制到剪贴板
    try{ navigator.clipboard.writeText(json); dlgAlert("已复制备份内容到剪贴板，粘贴到备忘录/文件保存即可。"); }
    catch(_){ dlgAlert("自动复制失败，请在导出的文件里手动保存。"); }
  }
}
function importData(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=async ()=>{
      try{
        const d=JSON.parse(r.result);
        const incoming = d && d.state && d.state.day ? d.state : (d && d.day ? d : null);
        if(!incoming) throw new Error("格式不符");
        const ok=await dlgConfirm("这会覆盖当前所有任务，建议先导出当前数据做备份。",{title:"导入并覆盖？",okLabel:"覆盖导入",danger:true});
        if(!ok) return;
        state=incoming;
        if(!save()) return;
        expanded={}; current=0;
        switchView("day");
        dlgAlert("数据已恢复。","✅ 导入成功");
      }catch(e){ dlgAlert("文件格式不正确，请选择本应用导出的备份文件。","❌ 导入失败"); }
    };
    r.readAsText(f);
  };
  inp.click();
}
document.getElementById("backupBtn").onclick=()=>{
  _openDialog({title:"备份 / 恢复",buttons:[
    {label:"导出备份文件",style:"ghost",value:"export"},
    {label:"从备份文件恢复",style:"ghost",value:"import"},
    {label:"取消",style:"ghost",value:null},
  ]}).then(c=>{
    if(c==="export") exportData();
    else if(c==="import") importData();
  });
};

/* ---------- PWA：让它能"装"到手机桌面、离线打开 ---------- */
(function setupPWA(){
  // 用 http(s) 打开时注册 Service Worker，支持离线；file:// 直接打开则跳过
  if("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").then((reg)=>{
      // 发现新版本 SW 就绪后，等它接管再自动刷新一次，用户无需手动清缓存
      reg.addEventListener("updatefound", ()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", ()=>{
          // 新 SW 装好且已有旧 SW 在控制页面 → 说明是"更新"，让它立即接管
          if(nw.state === "installed" && navigator.serviceWorker.controller){
            nw.postMessage("skip-waiting");
          }
        });
      });
      // 每次打开检查一次更新
      reg.update();
    }).catch(()=>{});
    // 新 SW 接管后自动刷新一次（只刷一次，避免死循环）
    let refreshed = false;
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{
      if(refreshed) return;
      refreshed = true;
      location.reload();
    });
  }
})();
