<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="步步" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#f4f8fd" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<title>步步</title>
<style>
  :root{
    --bg:#f4f8fd;
    --card:#ffffff;
    --ink:#1f2733;
    --sub:#8a93a3;
    --line:#e5edf6;
    --accent:#5b9df0;
    --accent-soft:#e6f0fd;
    --done:#c2cbd8;
    --danger:#ef5f6b;
    --shadow:0 1px 3px rgba(31,39,51,.04),0 8px 24px rgba(60,110,190,.07);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --nav-h:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  /* 用动态视口高度：普通浏览器里地址栏/底栏会占空间，svh/dvh 能自适应，避免底部导航被挡 */
  body{
    height:100vh;height:100svh;
  }
  @supports (height: 100dvh){ body{ height:100dvh; } }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* ---- 顶部标题 + 清单标签栏 ---- */
  header{padding:calc(var(--safe-top) + 22px) 0 0;background:var(--bg);flex:0 0 auto;}
  .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:0 20px 16px;}
  .title-row h1{font-size:25px;font-weight:700;margin:0;letter-spacing:-.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .title-row h1.long{font-size:21px;}
  .title-wrap{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1 1 auto;}
  .sub-row{display:flex;align-items:center;min-width:0;gap:2px;}
  .sub-row .sub-left{display:flex;align-items:center;min-width:0;flex:1 1 auto;gap:2px;}
  .sub-row .subtitle{font-size:13px;color:var(--sub);font-weight:400;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sub-row .count{font-size:13px;color:var(--sub);flex:0 0 auto;}
  .sub-row .count:not(:empty)::before{content:"·";margin:0 7px;color:var(--line);}
  /* 右侧工具区：上排图标(时间轴/导出)，下排日期切换，与图标右对齐 */
  .head-tools{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto;}
  .head-icons{display:flex;align-items:center;gap:12px;}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:0 20px 12px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs.hidden{display:none;}
  /* 日期切换：紧凑无边框，右对齐在图标下方 */
  .datenav{display:flex;align-items:center;gap:2px;flex:0 0 auto;}
  .datenav.hidden{display:none;}
  .datenav .nav-arrow{
    width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--sub);cursor:pointer;font-size:16px;flex:0 0 auto;transition:.15s;user-select:none;
  }
  .datenav .nav-arrow:active{background:var(--accent-soft);color:var(--accent);}
  .datenav .date-label{
    font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;
    display:flex;align-items:center;gap:5px;padding:2px 4px;
  }
  .datenav .date-label:active{color:var(--accent);}
  .tab{
    flex:0 0 auto;padding:7px 15px;border-radius:20px;font-size:14px;font-weight:500;
    background:var(--card);color:var(--sub);border:1px solid var(--line);
    white-space:nowrap;transition:.2s;cursor:pointer;user-select:none;max-width:40vw;
    overflow:hidden;text-overflow:ellipsis;}
  .tab.long{font-size:12.5px;padding:7px 12px;}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tab.add-list{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft);font-weight:600;}
  /* ---- 主体区域 ---- */
  .viewport{flex:1 1 auto;overflow:hidden;position:relative;}
  .track{display:flex;height:100%;transition:transform .32s cubic-bezier(.22,.61,.36,1);}
  .page{flex:0 0 100%;height:100%;overflow-y:auto;padding:4px 16px calc(var(--nav-h) + 100px + var(--safe-bottom));-webkit-overflow-scrolling:touch;}
  .single{position:absolute;inset:0;overflow-y:auto;padding:4px 16px calc(var(--nav-h) + 100px + var(--safe-bottom));-webkit-overflow-scrolling:touch;display:none;}
  /* ---- 任务卡片 ---- */
  .task{
    display:flex;align-items:flex-start;gap:11px;background:var(--card);
    border-radius:14px;padding:9px 28px 9px 15px;margin-top:7px;box-shadow:var(--shadow);
    transition:.15s;position:relative;
  }
  .task:active{transform:scale(.99);}
  .check{
    flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--done);
    margin-top:2px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;
  }
  .check svg{width:11px;height:11px;opacity:0;transition:.15s;}
  .task.done .check{background:var(--accent);border-color:var(--accent);}
  .task.done .check svg{opacity:1;}
  .task-body{flex:1 1 auto;min-width:0;}
  .task-head{display:flex;align-items:center;gap:8px;}
  .task-head .task-text{flex:1 1 auto;min-width:0;}
  .task-head .chip.time,.task-head .chip.addtime{flex:0 0 auto;}
  /* 时间前缀：放在任务文字最前，24h 时刻，accent 色、等宽数字 */
  .task-head .task-time{flex:0 0 auto;font-size:13.5px;font-weight:600;color:var(--accent);
    font-variant-numeric:tabular-nums;letter-spacing:.2px;cursor:pointer;line-height:1.3;}
  .task-chev{flex:0 0 auto;width:16px;text-align:center;color:var(--sub);cursor:pointer;
    font-size:10px;transition:transform .2s;user-select:none;}
  .task-chev.open{transform:rotate(90deg);}
  .task-text{font-size:15px;line-height:1.3;word-break:break-word;transition:.15s;font-weight:500;cursor:pointer;}
  .task-text:active{opacity:.6;}
  .task.done .task-text{color:var(--done);text-decoration:line-through;font-weight:400;}
  /* 节点：折叠箭头 + 进度 */
  .caret{flex:0 0 auto;width:16px;margin-top:3px;text-align:center;color:var(--sub);
    cursor:pointer;font-size:10px;transition:transform .2s;user-select:none;}
  .caret.open{transform:rotate(90deg);}
  .caret.leaf{visibility:hidden;}
  .check.ring{border:none;position:relative;}
  .check.ring::before{content:"";position:absolute;inset:3px;background:var(--card);border-radius:50%;}
  .check.ring svg{position:relative;z-index:1;}
  .prog-mini{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .prog-mini .prog{flex:1 1 auto;height:5px;border-radius:3px;background:#eef0f2;overflow:hidden;margin-top:0;}
  .prog-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .35s ease;}
  .prog-pct{flex:0 0 auto;font-size:11px;color:var(--sub);}
  .prog-pct.alldone{color:#34c759;}
  .children{margin:4px 0 2px 22px;padding-left:11px;border-left:2px solid var(--line);}
  .children .task{margin-top:6px;}
  .task-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center;}
  .chip{font-size:11px;padding:2px 8px;border-radius:9px;background:#f2f2f4;color:var(--sub);display:inline-flex;align-items:center;gap:3px;line-height:1.5;}
  .chip.time{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .chip.addtime{background:transparent;color:var(--sub);border:1px dashed var(--line);font-weight:500;cursor:pointer;}
  .chip.addtime:active{background:var(--accent-soft);color:var(--accent);}
  .chip.parent{background:transparent;color:var(--sub);padding-left:2px;}
  .chip.break{background:transparent;border:1px dashed var(--line);color:var(--sub);cursor:pointer;font-weight:500;}
  .chip.break:active{background:var(--accent-soft);}
  /* 专注：日程叶子任务专用，绝对定位到卡片右侧空白、垂直居中的圆形按钮 */
  .focus-btn{
    position:absolute;right:13px;top:50%;transform:translateY(-50%);
    width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
    transition:.15s;
  }
  .focus-btn svg{width:16px;height:16px;display:block;margin-left:1px;}
  .focus-btn:active{transform:translateY(-50%) scale(.9);background:var(--accent);color:#fff;}
  /* 有专注按钮的卡片：右侧留出圆钮空间，文字不与之重叠 */
  .task.has-focus{padding-right:60px;}
  /* ---- 习惯卡片：按次数打卡，日程置顶一条打卡行；周/月/年显示比例 ---- */
  .habit-section{margin:2px 0 4px;}
  .habit-section--divided{padding-bottom:10px;border-bottom:1px dashed var(--line);margin-bottom:2px;}
  .task-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--sub);
    margin:12px 2px 2px;letter-spacing:.5px;}
  .habit-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--sub);
    margin:8px 2px 2px;letter-spacing:.5px;}
  .habit{
    display:flex;align-items:center;gap:11px;background:var(--card);
    border-radius:14px;padding:9px 12px 9px 15px;margin-top:7px;box-shadow:var(--shadow);
    transition:.15s;position:relative;border-left:3px solid var(--accent-soft);
  }
  .habit.reached{border-left-color:#34c759;}
  .habit-body{flex:1 1 auto;min-width:0;}
  .habit-text{font-size:15px;line-height:1.3;font-weight:500;word-break:break-word;}
  .habit.reached .habit-text{color:var(--done);}
  .habit-sub{font-size:11.5px;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:6px;}
  .habit-sub .cnt{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;}
  .habit.reached .habit-sub .cnt{color:#34c759;}
  /* 打卡区：perDay===1 单个圆钮；perDay>1 用 − N/M ＋ 步进 */
  .habit-tick{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--done);
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;color:#fff;}
  .habit-tick svg{width:14px;height:14px;opacity:0;transition:.15s;}
  .habit-tick.on{background:var(--accent);border-color:var(--accent);}
  .habit-tick.on svg{opacity:1;}
  .habit-tick.reached{background:#34c759;border-color:#34c759;}
  .habit-tick:active{transform:scale(.9);}
  .habit-step{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
  .habit-step .sbtn{width:28px;height:28px;border-radius:50%;background:var(--bg);color:var(--accent);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;line-height:1;user-select:none;transition:.12s;}
  .habit-step .sbtn.plus{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(91,157,240,.35);}
  .habit-step .sbtn.reached{background:#34c759;box-shadow:0 3px 10px rgba(52,199,89,.35);}
  .habit-step .sbtn:active{transform:scale(.88);}
  .habit-step .sbtn.dim{opacity:.35;pointer-events:none;}
  .habit-step .num{font-size:14px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;min-width:34px;text-align:center;}
  .habit .del{top:5px;right:7px;}
  /* 周/月/年清单里的习惯行：显示区间比例，可原地打卡 */
  .habit-ratio{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
  .habit.reached .habit-ratio{color:#34c759;}
  .habit-bar{height:5px;border-radius:3px;background:#eef0f2;overflow:hidden;margin-top:6px;}
  .habit-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .35s ease;}
  .habit.reached .habit-bar-fill{background:#34c759;}
  .del{position:absolute;top:7px;right:9px;color:var(--sub);font-size:14px;line-height:1;
    padding:3px;cursor:pointer;opacity:.28;}
  .del:active{opacity:1;color:var(--danger);}
  .empty{text-align:center;color:var(--sub);font-size:14px;margin-top:70px;line-height:2;}
  .empty .big{font-size:44px;display:block;margin-bottom:8px;}
  /* ---- 底部提交栏 ---- */
  .composer{
    position:absolute;left:0;right:0;bottom:var(--nav-h);padding:12px 16px 10px;
    background:linear-gradient(180deg,rgba(244,248,253,0) 0%,var(--bg) 34%);
  }
  .picker-row{display:none;margin-bottom:8px;}
  .picker-row.show{display:flex;gap:8px;align-items:center;}
  .picker-row .time-field{
    flex:1 1 auto;border:none;background:var(--card);border-radius:16px;padding:10px 14px;
    font-size:15px;box-shadow:var(--shadow);color:var(--ink);cursor:pointer;user-select:none;
  }
  .picker-row .time-field.empty{color:var(--sub);}
  .picker-row .clear-time{font-size:13px;color:var(--danger);padding:6px 10px;cursor:pointer;}
  /* 已选上级目标的提示条（输入框上方，一行文字，可点✕取消） */
  .parent-hint{display:none;align-items:center;gap:6px;margin-bottom:8px;font-size:13px;
    color:var(--accent);background:var(--accent-soft);border-radius:12px;padding:8px 12px;}
  .parent-hint.show{display:flex;}
  .parent-hint .ph-x{margin-left:auto;cursor:pointer;opacity:.7;font-size:15px;line-height:1;padding:0 2px;}
  .parent-hint .ph-x:active{opacity:1;}
  /* 挂靠上级弹层：分组竖排的目标列表 */
  .ph-close{width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--sub);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;user-select:none;}
  .ph-close:active{background:var(--accent-soft);color:var(--accent);}
  .ph-body{max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .ph-group-label{font-size:12px;font-weight:700;color:var(--sub);margin:14px 2px 6px;letter-spacing:.5px;}
  .ph-group-label:first-child{margin-top:2px;}
  .ph-opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;
    background:var(--bg);margin-bottom:8px;cursor:pointer;transition:.12s;font-size:15px;color:var(--ink);}
  .ph-opt:active{transform:scale(.99);}
  .ph-opt.sel{background:var(--accent);color:#fff;}
  .ph-opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--done);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;transition:.12s;}
  .ph-opt.sel .radio{border-color:#fff;}
  .ph-opt.sel .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff;}
  .ph-opt .txt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ph-empty{text-align:center;color:var(--sub);font-size:14px;padding:28px 0;line-height:1.9;}
  .input-row{display:flex;gap:8px;align-items:center;}
  .composer input.main-input{
    flex:1 1 auto;min-width:0;border:none;outline:none;background:var(--card);
    border-radius:24px;padding:13px 16px;font-size:16px;box-shadow:var(--shadow);color:var(--ink);
  }
  .composer input.main-input::placeholder{color:var(--sub);}
  .icon-btn{
    flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:none;background:var(--card);
    color:var(--sub);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:var(--shadow);transition:.15s;
  }
  .icon-btn.on{background:var(--accent-soft);color:var(--accent);}
  .submit{
    flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:none;background:var(--accent);
    color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 4px 14px rgba(91,157,240,.4);transition:.15s;
  }
  .submit:active{transform:scale(.9);}
  /* ---- 底部四宫格导航 ---- */
  .nav{
    position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-bottom));
    padding-bottom:var(--safe-bottom);display:flex;background:rgba(255,255,255,.92);
    backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:1px solid var(--line);
  }
  .nav-item{
    flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--sub);font-size:11px;cursor:pointer;transition:.15s;user-select:none;
  }
  .nav-item .ni{font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .nav-item .ni svg{width:23px;height:23px;display:block;}
  .nav-item.active{color:var(--accent);}

  /* ---- header 模式切换图标（清单/时间轴） ---- */
  .mode-toggle{display:flex;align-items:center;cursor:pointer;color:var(--sub);user-select:none;padding:2px;}
  .mode-toggle svg{width:21px;height:21px;display:block;}
  .mode-toggle.on{color:var(--accent);}

  /* ---- 番茄钟计时浮层 ---- */
  .timer-mask{
    position:fixed;inset:0;background:rgba(32,35,46,.32);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:60;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .timer-mask.show{opacity:1;pointer-events:auto;}
  .timer-card{
    width:86%;max-width:340px;background:var(--card);border-radius:24px;
    padding:26px 24px 22px;box-shadow:0 12px 40px rgba(40,45,80,.24);text-align:center;
    transform:scale(.92);transition:transform .24s cubic-bezier(.22,.61,.36,1);
  }
  .timer-mask.show .timer-card{transform:scale(1);}
  .timer-task{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px;line-height:1.35;}
  .timer-sub{font-size:12px;color:var(--sub);margin-bottom:18px;}
  .timer-clock{font-size:56px;font-weight:700;letter-spacing:1px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1;}
  .timer-adjust{display:flex;align-items:center;justify-content:center;gap:18px;margin:16px 0 22px;}
  .timer-adjust .step{
    width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);
    font-size:22px;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;
  }
  .timer-adjust .step:active{background:var(--accent-soft);color:var(--accent);}
  .timer-adjust .step.disabled{opacity:.3;pointer-events:none;}
  .timer-adjust .len{font-size:14px;color:var(--sub);min-width:64px;}
  .timer-btns{display:flex;flex-direction:column;gap:10px;}
  .timer-btns .btn{
    padding:13px;border-radius:15px;font-size:16px;font-weight:600;cursor:pointer;user-select:none;border:none;
  }
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.primary:active{transform:scale(.98);}
  .btn.ghost{background:var(--bg);color:var(--ink);}
  .btn.danger{background:transparent;color:var(--sub);font-weight:500;font-size:14px;padding:6px;}
  .btn.danger:active{color:var(--danger);}

  /* ---- 通用应用内弹窗（替代浏览器 prompt/confirm/alert）---- */
  .dialog-mask{
    position:fixed;inset:0;background:rgba(32,35,46,.32);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:80;padding:24px;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .dialog-mask.show{opacity:1;pointer-events:auto;}
  .dialog-card{
    width:100%;max-width:340px;background:var(--card);border-radius:22px;
    padding:22px 20px 18px;box-shadow:0 12px 40px rgba(40,45,80,.24);
    transform:scale(.92);transition:transform .24s cubic-bezier(.22,.61,.36,1);
  }
  .dialog-mask.show .dialog-card{transform:scale(1);}
  .dialog-title{font-size:17px;font-weight:700;color:var(--ink);text-align:center;line-height:1.4;}
  .dialog-msg{font-size:14px;color:var(--sub);text-align:center;line-height:1.6;margin-top:8px;white-space:pre-line;}
  .dialog-input{
    width:100%;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;

  /* ---- 时间轴视图 ---- */

    position:absolute;left:0;right:0;border-radius:10px;padding:5px 9px;overflow:hidden;

  .tl-chart-toggle .seg{
    width:34px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    color:var(--sub);cursor:pointer;transition:.15s;user-select:none;
  }
  .tl-chart-toggle .seg svg{width:17px;height:17px;display:block;}
  .tl-chart-toggle .seg.on{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(31,39,51,.1);}
  .tl-stats{margin-top:6px;}
  /* 饼（环形）图 */
  .tl-pie-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:16px;}
  .tl-pie{flex:0 0 auto;position:relative;width:132px;height:132px;}
  .tl-pie svg{transform:rotate(-90deg);display:block;}
  .tl-pie-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .tl-pie-center .big{font-size:15px;font-weight:700;color:var(--ink);line-height:1.05;}
  .tl-pie-center .sm{font-size:10px;color:var(--sub);margin-top:2px;}
  .tl-pie-legend{width:100%;}
  .tl-pie-legend .lg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);margin-bottom:9px;}
  .tl-pie-legend .lg:last-child{margin-bottom:0;}
  .tl-pie-legend .lg .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tl-pie-legend .lg .vl{flex:0 0 auto;color:var(--sub);font-size:12px;}
  /* 条形图 */
  .tl-barchart{margin-bottom:14px;}
  .tl-stat-row{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
  .tl-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
  .tl-stat-body{flex:1 1 auto;min-width:0;}
  .tl-stat-top{display:flex;justify-content:space-between;font-size:13px;color:var(--ink);margin-bottom:5px;}
  .tl-stat-top .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tl-stat-top .mins{color:var(--sub);font-size:12px;flex:0 0 auto;margin-left:8px;}
  .tl-bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden;}
  .tl-bar-fill{height:100%;border-radius:5px;transition:width .3s;}
  .tl-total{text-align:center;font-size:13px;color:var(--sub);margin:2px 0 24px;}

  /* ---- 月度概览（甘特式跨度条） ---- */

  .mv-monthbar{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0 14px;}
  .mv-monthbar .nav-arrow{
    width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--sub);cursor:pointer;
    font-size:15px;flex:0 0 auto;user-select:none;transition:.15s;
  }
  .mv-monthbar .nav-arrow:active{background:var(--accent-soft);color:var(--accent);}
  .mv-month-label{font-size:15px;font-weight:600;color:var(--ink);min-width:110px;text-align:center;}
  .mv-scale{display:none;}
  .mv-group-label{font-size:12px;font-weight:700;color:var(--sub);margin:16px 2px 8px;letter-spacing:.5px;}
  .mv-group-label:first-child{margin-top:4px;}
  .mv-row{background:var(--card);border-radius:14px;padding:11px 14px;margin-bottom:8px;box-shadow:var(--shadow);}
  .mv-row-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .mv-color-dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;}
  .mv-name{flex:1 1 auto;min-width:0;font-size:15px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mv-row.done .mv-name{color:var(--sub);text-decoration:line-through;}
  .mv-badge{flex:0 0 auto;font-size:11px;font-weight:600;padding:2px 9px;border-radius:9px;}
  .mv-badge.doing{background:var(--accent-soft);color:var(--accent);}
  .mv-badge.done{background:#e4f6ee;color:#2fa877;}
  .mv-badge.idle{background:#f1f1f4;color:var(--sub);}
  .mv-edit{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sub);cursor:pointer;}
  .mv-edit svg{width:15px;height:15px;}
  .mv-edit:active{background:var(--accent-soft);color:var(--accent);}
  .mv-track{position:relative;height:20px;border-radius:6px;background:var(--bg);overflow:hidden;}
  .mv-span{position:absolute;top:4px;height:12px;border-radius:6px;opacity:.9;}
  .mv-day{position:absolute;top:5px;width:10px;height:10px;border-radius:50%;transform:translateX(-50%);}
  .mv-end{position:absolute;top:2px;width:0;height:16px;border-left:2px solid var(--ink);}
  .mv-end-flag{position:absolute;top:-2px;font-size:10px;transform:translateX(-50%);}
  .mv-meta{font-size:12px;color:var(--sub);margin-top:2px;display:flex;justify-content:space-between;gap:10px;}
  .mv-meta span:first-child{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mv-meta span:last-child{flex:0 0 auto;}
  .mv-empty{text-align:center;color:var(--sub);font-size:14px;margin-top:64px;line-height:2;}
  .mv-empty .big{font-size:44px;display:block;margin-bottom:8px;}
  /* 手动校准弹层复用 .cal-* / .ph-* 结构 */
  .mv-edit-field{margin:6px 2px 14px;}
  .mv-edit-field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;}
  .mv-edit-field input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;
    padding:11px 13px;font-size:15px;color:var(--ink);font-family:inherit;}
  .date-field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;
    padding:11px 13px;font-size:15px;color:var(--ink);cursor:pointer;user-select:none;box-sizing:border-box;}
  .date-field.empty{color:var(--sub);}
  .date-field:active{background:var(--accent-soft);}
  .mv-edit-hint{font-size:12px;color:var(--sub);line-height:1.6;margin:2px 2px 12px;}
  .mv-edit-reset{text-align:center;font-size:13px;color:var(--danger);padding:8px;cursor:pointer;margin-top:4px;}
  .cal-mask{
    position:fixed;inset:0;background:rgba(32,35,46,.28);backdrop-filter:blur(2px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .cal-mask.show{opacity:1;pointer-events:auto;}
  .cal-sheet{
    width:100%;max-width:480px;background:var(--card);border-radius:22px 22px 0 0;
    padding:18px 18px calc(20px + var(--safe-bottom));box-shadow:0 -8px 30px rgba(40,45,80,.14);
    transform:translateY(100%);transition:transform .26s cubic-bezier(.22,.61,.36,1);
  }
  .cal-mask.show .cal-sheet{transform:translateY(0);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-title{font-size:17px;font-weight:700;}
  .cal-nav{display:flex;gap:8px;}
  .cal-nav .arrow{
    width:34px;height:34px;border-radius:50%;background:var(--bg);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--sub);cursor:pointer;
    font-size:16px;user-select:none;transition:.15s;
  }
  .cal-nav .arrow:active{background:var(--accent-soft);color:var(--accent);}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
  .cal-week span{text-align:center;font-size:12px;color:var(--sub);padding:4px 0;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-cell{
    aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:14px;border-radius:12px;cursor:pointer;position:relative;color:var(--ink);
    user-select:none;transition:.12s;
  }
  .cal-cell.other{color:#c9ccd8;}
  .cal-cell:active{background:var(--accent-soft);}
  .cal-cell.today{color:var(--accent);font-weight:700;}
  .cal-cell.sel{background:var(--accent);color:#fff;font-weight:700;}
  .cal-cell.sel.today{color:#fff;}
  .cal-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);position:absolute;bottom:6px;}
  .cal-cell.sel .cal-dot{background:#fff;}
  .cal-foot{display:flex;justify-content:center;margin-top:14px;}
  .cal-today-btn{
    font-size:14px;font-weight:600;color:var(--accent);background:var(--accent-soft);
    padding:9px 22px;border-radius:14px;cursor:pointer;user-select:none;
  }
  /* 应用内日期时间选择器 */
  .cal-month-label{text-align:center;font-size:15px;font-weight:600;color:var(--ink);margin:-4px 0 10px;}
  /* ---- 新建/编辑习惯弹层 ---- */
  .hb-body{max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .hb-field{margin-bottom:14px;}
  .hb-field>label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:7px;letter-spacing:.3px;}
  .hb-input{width:100%;border:none;background:var(--bg);border-radius:14px;padding:12px 14px;
    font-size:16px;color:var(--ink);outline:none;box-sizing:border-box;}
  .hb-seg{display:flex;gap:6px;flex-wrap:wrap;}
  .hb-seg .seg{flex:1 1 auto;text-align:center;font-size:13px;padding:9px 6px;border-radius:12px;
    background:var(--bg);color:var(--sub);cursor:pointer;user-select:none;transition:.12s;white-space:nowrap;}
  .hb-seg .seg.on{background:var(--accent);color:#fff;font-weight:600;}
  .hb-stepper{display:flex;align-items:center;gap:16px;}
  .hb-stepper .st{width:36px;height:36px;border-radius:50%;background:var(--bg);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;user-select:none;transition:.12s;}
  .hb-stepper .st:active{transform:scale(.88);background:var(--accent-soft);}
  .hb-stepper .stv{font-size:18px;font-weight:700;min-width:40px;text-align:center;font-variant-numeric:tabular-nums;}
  .hb-days{display:flex;gap:6px;}
  .hb-days .d{flex:1 1 0;text-align:center;padding:10px 0;border-radius:12px;background:var(--bg);
    color:var(--sub);font-size:14px;cursor:pointer;user-select:none;transition:.12s;}
  .hb-days .d.on{background:var(--accent);color:#fff;font-weight:600;}
  .hb-targets{display:flex;gap:8px;}
  .hb-tg{flex:1 1 0;background:var(--bg);border-radius:12px;padding:8px 10px;}
  .hb-tg span{display:block;font-size:11px;color:var(--sub);margin-bottom:4px;}
  .hb-tg input{width:100%;border:none;background:transparent;font-size:15px;color:var(--ink);outline:none;
    font-variant-numeric:tabular-nums;box-sizing:border-box;}
  .hb-hint{font-size:11.5px;color:var(--sub);margin-top:8px;line-height:1.6;}
  .hb-del{background:transparent;color:var(--danger);}
  .hidden{display:none !important;}
  .dt-time{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;}
  .dt-time-label{font-size:13px;color:var(--sub);margin-bottom:8px;}
  .dt-time-rows{display:flex;align-items:center;gap:8px;justify-content:center;}
  .dt-colon{font-size:20px;font-weight:700;color:var(--ink);}
  .dt-scroll{display:flex;gap:6px;overflow-x:auto;padding:2px;scrollbar-width:none;max-width:44%;}
  .dt-scroll::-webkit-scrollbar{display:none;}
  .dt-cell{flex:0 0 auto;min-width:44px;text-align:center;padding:8px 0;border-radius:12px;
    background:var(--bg);color:var(--ink);font-size:15px;cursor:pointer;user-select:none;transition:.12s;}
  .dt-cell.sel{background:var(--accent);color:#fff;font-weight:700;}
  .dt-foot{display:flex;gap:10px;margin-top:16px;}
  .dt-clear{flex:0 0 auto;font-size:14px;color:var(--danger);background:var(--bg);
    padding:11px 20px;border-radius:14px;cursor:pointer;user-select:none;}
  .dt-ok{flex:1 1 auto;text-align:center;font-size:15px;font-weight:600;color:#fff;background:var(--accent);
    padding:11px 0;border-radius:14px;cursor:pointer;user-select:none;}
</style>

  <header>

  <!-- 月度概览：手动校准某个目标的起止日期 --><div class="cal-mask" id="habitMask">

<script>
const STORE_KEY = "shiguang.v3";
const TIMER_KEY = "shiguang.timer";   // 活动中的番茄钟，刷新/切后台不丢
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';

/* ---------- 应用内弹窗（替代浏览器 prompt / confirm / alert）----------
   全部返回 Promise，用 await 调用，风格与 App 内其它弹层一致 */
const dlgMask=()=>document.getElementById("dialogMask");
function _closeDialog(){ const m=dlgMask(); if(m) m.classList.remove("show"); }
function _openDialog({title="", msg="", input=false, inputValue="", placeholder="", buttons=[]}){
  return new Promise(resolve=>{
    const mask=dlgMask();
    mask.querySelector("#dialogTitle").textContent=title;
    const msgEl=mask.querySelector("#dialogMsg");
    msgEl.textContent=msg; msgEl.style.display=msg?"block":"none";
    const inp=mask.querySelector("#dialogInput");
    if(input){
      inp.style.display="block"; inp.value=inputValue; inp.placeholder=placeholder||"";
    } else inp.style.display="none";
    const btnBox=mask.querySelector("#dialogBtns"); btnBox.innerHTML="";
    const done=(val)=>{ _closeDialog(); mask.onclick=null; document.removeEventListener("keydown",onKey); resolve(val); };
    buttons.forEach(b=>{
      const el=document.createElement("div");
      el.className="btn "+(b.style||"ghost");
      el.textContent=b.label;
      el.onclick=()=>done(typeof b.value==="function"? b.value() : b.value);
      btnBox.appendChild(el);
    });
    // 点遮罩空白 = 取消（返回第一个 value 为 null 的按钮结果，否则 null）
    mask.onclick=(e)=>{ if(e.target===mask) done(null); };
    const onKey=(e)=>{
      if(e.key==="Escape") done(null);
      else if(e.key==="Enter" && input){ const ok=buttons.find(b=>b.enter); if(ok) done(typeof ok.value==="function"? ok.value():ok.value); }
    };
    document.addEventListener("keydown",onKey);
    mask.classList.add("show");
    if(input) setTimeout(()=>{ inp.focus(); inp.select(); },60);
  });
}
// 提示：只有一个"知道了"按钮
function dlgAlert(msg,title=""){ return _openDialog({title:title||msg,msg:title?msg:"",buttons:[{label:"知道了",style:"ghost",value:true,enter:true}]}); }

function dlgConfirm(msg,{title="",okLabel="确定",cancelLabel="取消",danger=false}={}){

}
// 输入：返回字符串（取消返回 null）
function dlgPrompt(title,{msg="",value="",placeholder="",okLabel="确定"}={}){

/* ---------- 数据 ----------
 state = {
   day:  { lists:[ {name, tasks:[]} ] },   // 可滑动多清单；每条 day 任务带 date:"YYYY-MM-DD"

 }
 task = { id, text, done, createdAt, due(可空), date(仅日程), children:[子任务id], parentText(可空),
          sessions:[{start,end,focusSec}] 专注记录 }
*/
let state = load();
let view = "day";      // day | week | month | year

/* ---------- 日期工具 ---------- */
function pad2(n){ return String(n).padStart(2,"0"); }
function dateStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function todayStr(){ return dateStr(new Date()); }
function shiftDate(str, days){ const d=new Date(str+"T00:00:00"); d.setDate(d.getDate()+days); return dateStr(d); }
// 顶部日期条的友好文字：今天 / 明天 / 昨天 / 周几 · M月D日
function fmtDateLabel(str){
  const d=new Date(str+"T00:00:00");
  const t=todayStr();
  const week=["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  const md=`${d.getMonth()+1}月${d.getDate()}日`;
  if(str===t) return `今天 · ${md}`;
  if(str===shiftDate(t,1)) return `明天 · ${md}`;
  if(str===shiftDate(t,-1)) return `昨天 · ${md}`;
  return `${week} · ${md}`;
}
// 顶部日期切换的紧凑文字：今天 / 明天 / M月D日（周几），比 fmtDateLabel 更短
function fmtDateNav(str){
  const d=new Date(str+"T00:00:00");
  const t=todayStr();
  const md=`${d.getMonth()+1}月${d.getDate()}日`;
  if(str===t) return "今天";
  if(str===shiftDate(t,1)) return "明天";
  if(str===shiftDate(t,-1)) return "昨天";
  const week=["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  return `${md} ${week}`;
}

function blank(){
  return {
    day:{ lists:[ {name:"今天",tasks:[]}, {name:"工作",tasks:[]}, {name:"生活",tasks:[]} ] },
    week:{ tasks:[] }, month:{ tasks:[] }, year:{ tasks:[] },
    habits:[]   // 习惯：跨天/周/月/年只算次数的任务，打卡自动上卷到各层
  };
}

/* ---------- 示例数据：一棵完整的「年→月→周→日」目标树 ---------- */
function seed(){
  const s = blank();
  let n = 0;
  const id = ()=> "seed-"+(n++);           // 稳定 id，便于父子挂钩
  const mk = (text, extra={})=> Object.assign(
    { id:id(), text, done:false, createdAt:Date.now()-(1000*n), due:null, parentText:null, children:[], sessions:[] }, extra);

  // —— 日程：把最细的执行项放进「今天 / 工作 / 生活」——
  const dToday = s.day.lists[0].tasks;   // 今天
  const dWork  = s.day.lists[1].tasks;   // 工作
  const dLife  = s.day.lists[2].tasks;   // 生活

  const nowH = new Date(); nowH.setHours(20,0,0,0);
  const pad=x=>String(x).padStart(2,"0");
  const today = todayStr();
  const todayAt=(h,m)=>{ const d=new Date(); d.setHours(h,m,0,0);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(h)}:${pad(m)}`; };
  // 造几段"今天"的专注记录，让时间轴一打开就有内容
  const atMs=(h,m)=>{ const d=new Date(); d.setHours(h,m,0,0); return d.getTime(); };
  const sess=(sh,sm,mins)=>({ start:atMs(sh,sm), end:atMs(sh,sm)+mins*60000, focusSec:mins*60 });

  // 读书线的叶子（日程任务带 date）
  const read30 = mk("读《原则》30页", { parentText:"这周读完《原则》上半", due:todayAt(21,0), done:true, date:today, sessions:[sess(9,10,50), sess(10,20,25)] });
  const readNote = mk("整理2页读书笔记", { parentText:"这周读完《原则》上半", due:todayAt(21,40), date:today });
  // 跑步线的叶子
  const run1 = mk("晨跑 5 公里", { parentText:"本周跑步3次", done:true, date:today, sessions:[sess(7,0,30)] });
  const run2 = mk("晚间快走 40 分钟", { parentText:"本周跑步3次", due:todayAt(19,30), date:today });
  // 作品集线的叶子
  const prd = mk("写完 PRD 初稿第一章", { parentText:"完成作品集2个案例", due:todayAt(15,0), date:today, sessions:[sess(14,0,25), sess(15,0,45)] });
  dToday.push(read30, readNote, run2);
  dWork.push(prd);
  dLife.push(run1);

  // —— 周计划 ——
  const wRead = mk("这周读完《原则》上半", { parentText:"6月读完2本书", children:[read30.id, readNote.id] });
  const wRun  = mk("本周跑步3次",         { parentText:"6月保持20次运动", children:[run1.id, run2.id] });
  const wPrd  = mk("完成作品集2个案例",     { parentText:"上半年产出完整作品集", children:[prd.id] });
  s.week.tasks.push(wRead, wRun, wPrd);

  // —— 月计划 ——
  const mBook = mk("6月读完2本书",     { parentText:"今年读24本书",        children:[wRead.id] });
  const mMove = mk("6月保持20次运动",  { parentText:"今年养成运动习惯",     children:[wRun.id] });
  const mWork = mk("6月完成作品集案例",  { parentText:"上半年拿到心仪 offer", children:[wPrd.id] });
  s.month.tasks.push(mBook, mMove, mWork);

  // —— 年度目标 ——
  const yBook = mk("今年读完24本书",       { children:[mBook.id] });
  const yBody = mk("今年养成规律运动习惯",  { children:[mMove.id] });
  const yWork = mk("上半年产出完整作品集，拿到心仪 offer", { children:[mWork.id] });
  s.year.tasks.push(yBook, yBody, yWork);

  // —— 习惯：只按次数计的任务，打卡自动上卷到周/月/年 ——
  const nowT = Date.now();
  const dayMs = 86400000;
  s.habits = [
    // 每天 8 杯水：今天已打 3 杯
    { id:"seed-h1", text:"喝水", perDay:8, freq:"daily", weekTarget:56, monthTarget:240, yearTarget:2920,
      checkins:[nowT-3600000*2, nowT-3600000, nowT-600000] },
    // 每天冥想：过去一周打了 4 天
    { id:"seed-h2", text:"冥想 10 分钟", perDay:1, freq:"daily", weekTarget:7, monthTarget:30, yearTarget:365,
      checkins:[nowT-dayMs*5, nowT-dayMs*3, nowT-dayMs*1, nowT-1800000] },
  ];

  return s;
}
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const d = JSON.parse(raw); if(d && d.day) return migrate(d); }
  }catch(e){}
  return seed();   // 首次打开：载入示例目标树
}
// 迁移：给还没有 date 的日程任务补上"今天"、给所有任务补 sessions，保证旧数据平滑升级、不丢
function migrate(d){
  const t=todayStr();
  try{
    (d.day.lists||[]).forEach(l=>(l.tasks||[]).forEach(task=>{
      if(!task.date) task.date=t;
      if(!task.sessions) task.sessions=[];
    }));
    ["week","month","year"].forEach(v=>(d[v]&&d[v].tasks||[]).forEach(task=>{
      if(!task.sessions) task.sessions=[];
    }));
    if(!Array.isArray(d.habits)) d.habits=[];   // 旧数据补空习惯数组，平滑升级
    // doneAt / manualSpan 为可选新字段，无需回填（缺省即"未记录/自动"）
  }catch(e){}
  return d;
}
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    return true;
  }catch(e){
    // 存储失败（隐私模式/配额满）时提醒用户，避免以为存上了其实没存
    console.warn("保存失败", e);
    dlgAlert("可能是浏览器隐私模式或存储空间已满。\n请在普通模式下打开，或清理空间后重试。","⚠️ 数据保存失败");
    return false;
  }
}
function uid(){ return Date.now()+"-"+Math.random().toString(36).slice(2,6); }

/* ---------- 完成音效：短促悦耳的"叮"，用 WebAudio 现场合成，无需音频文件 ---------- */
let _audioCtx=null;
function playDing(){
  try{
    _audioCtx = _audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(_audioCtx.state==="suspended") _audioCtx.resume();
    const ctx=_audioCtx, now=ctx.currentTime;
    // 两个上行音（C6→E6），营造"完成"的轻快感
    [ [1046.5,0], [1318.5,0.09] ].forEach(([freq,at])=>{
      const osc=ctx.createOscillator(), g=ctx.createGain();
      osc.type="sine"; osc.frequency.value=freq;
      g.gain.setValueAtTime(0, now+at);
      g.gain.linearRampToValueAtTime(0.18, now+at+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, now+at+0.22);
      osc.connect(g).connect(ctx.destination);
      osc.start(now+at); osc.stop(now+at+0.24);
    });
  }catch(e){/* 静默失败：音效非关键路径 */}
}

/* ---------- 全量任务索引：跨视图按 id 找任务 ---------- */
let expanded = {};  // { taskId: true } 记住展开状态
function allTasks(){
  const out=[];
  state.day.lists.forEach(l=>l.tasks.forEach(t=>out.push(t)));
  ["week","month","year"].forEach(v=>state[v].tasks.forEach(t=>out.push(t)));
  return out;
}
function taskById(id){ return allTasks().find(t=>t.id===id) || null; }
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function childrenOf(task){
  if(!task.children||!task.children.length) return [];
  return task.children.map(taskById).filter(Boolean);
}
/* 递归进度：叶子看 done，父节点看所有后代叶子完成比例 */
function progressOf(task){
  const kids=childrenOf(task);
  if(!kids.length) return { done: task.done?1:0, total:1, leaf:true };
  let done=0,total=0;
  kids.forEach(k=>{ const p=progressOf(k); done+=p.done; total+=p.total; });
  return { done, total, leaf:false };
}
// 收集某目标下所有后代叶子任务（含自身若为叶子），用于月度概览取活动日期
function leafDescendants(task, out){
  out=out||[];
  const kids=childrenOf(task);
  if(!kids.length){ out.push(task); return out; }
  kids.forEach(k=>leafDescendants(k,out));
  return out;
}
// 某月目标的"活动日期集合"：来自所有后代叶子（日任务）的 date / 专注 session / 完成日
function activeDatesOf(task){
  const dates=new Set();
  leafDescendants(task).forEach(leaf=>{
    if(leaf.date) dates.add(leaf.date);
    (leaf.sessions||[]).forEach(s=>dates.add(dateStr(new Date(s.start))));
    if(leaf.doneAt) dates.add(dateStr(new Date(leaf.doneAt)));
  });
  if(task.doneAt) dates.add(dateStr(new Date(task.doneAt)));
  return dates;
}

/* ---------- 习惯：按次数计的任务，打卡自动上卷到日/周/月/年 ----------
   habit = { id, text, perDay, freq, weekTarget, monthTarget, yearTarget, checkins:[时间戳...] }
   freq: "daily"（每天）| "weekN"（每周N次）| "monthN"（每月N次）| "days:1,3,5"（指定星期几，0=周日）*/
function habitById(id){ return (state.habits||[]).find(h=>h.id===id) || null; }
// 一周的起止（周一为一周之始，与国内习惯一致）
function weekRange(dateStr_){
  const d=new Date(dateStr_+"T00:00:00");
  const dow=(d.getDay()+6)%7;          // 周一=0 … 周日=6
  const start=new Date(d); start.setDate(d.getDate()-dow); start.setHours(0,0,0,0);
  const end=new Date(start); end.setDate(start.getDate()+7);
  return { start:start.getTime(), end:end.getTime() };
}
function monthRange(ym){                // ym: YYYY-MM
  const [y,m]=ym.split("-").map(Number);
  return { start:new Date(y,m-1,1).getTime(), end:new Date(y,m,1).getTime() };
}
function yearRange(year){
  return { start:new Date(year,0,1).getTime(), end:new Date(year+1,0,1).getTime() };
}
// 统计 checkins 落在 [start,end) 内的次数
function countIn(habit, start, end){
  return (habit.checkins||[]).filter(ts=>ts>=start && ts<end).length;
}
function habitDayCount(habit, dateStr_){
  const s=new Date(dateStr_+"T00:00:00").getTime();
  return countIn(habit, s, s+86400000);
}
function habitTodayCount(habit){ return habitDayCount(habit, currentDate); }
// 打卡 / 撤销一次（针对某天，默认今天用"现在"，历史日用当天中午的时间戳）
function habitCheck(habit, dateStr_){
  const day = dateStr_ || currentDate;
  const ts = day===todayStr() ? Date.now() : new Date(day+"T12:00:00").getTime();
  (habit.checkins ||= []).push(ts);
  save();
}
function habitUncheck(habit, dateStr_){
  const day = dateStr_ || currentDate;
  const s=new Date(day+"T00:00:00").getTime(), e=s+86400000;
  const arr=habit.checkins||[];
  // 撤销当天最后一次打卡
  for(let i=arr.length-1;i>=0;i--){ if(arr[i]>=s && arr[i]<e){ arr.splice(i,1); break; } }
  save();
}
// 某范围内的进度：{done,total,ratio,reached}
function habitRangeProgress(habit, kind){
  let count, target;
  if(kind==="week"){ const r=weekRange(currentDate); count=countIn(habit,r.start,r.end); target=habit.weekTarget||habitAutoWeek(habit); }
  else if(kind==="month"){ const ym=(mvMonth||todayStr().slice(0,7)); const r=monthRange(ym); count=countIn(habit,r.start,r.end); target=habit.monthTarget||habitAutoMonth(habit); }
  else if(kind==="year"){ const y=new Date(currentDate+"T00:00:00").getFullYear(); const r=yearRange(y); count=countIn(habit,r.start,r.end); target=habit.yearTarget||habitAutoYear(habit); }
  else { count=habitTodayCount(habit); target=habit.perDay||1; }   // day
  target=Math.max(1,target);
  return { done:count, total:target, ratio:Math.min(1,count/target), reached:count>=target };
}
// 频次 → 各层默认目标（用户没填时兜底）
function habitPerWeekTimes(habit){
  if(habit.freq==="daily") return 7*(habit.perDay||1);
  const wm=/^week(\d+)$/.exec(habit.freq||""); if(wm) return Number(wm[1]);
  const mm=/^month(\d+)$/.exec(habit.freq||""); if(mm) return Number(mm[1])/4.345;
  const dm=/^days:(.+)$/.exec(habit.freq||""); if(dm) return dm[1].split(",").filter(x=>x!=="").length*(habit.perDay||1);
  return 7;
}
function habitAutoWeek(habit){ return Math.round(habitPerWeekTimes(habit)); }
function habitAutoMonth(habit){ return Math.round(habitPerWeekTimes(habit)*4.345); }
function habitAutoYear(habit){ return Math.round(habitPerWeekTimes(habit)*52.14); }
// 频次友好文字
function habitFreqLabel(habit){
  if(habit.freq==="daily") return habit.perDay>1 ? `每天 ${habit.perDay} 次` : "每天";
  const wm=/^week(\d+)$/.exec(habit.freq||""); if(wm) return `每周 ${wm[1]} 次`;
  const mm=/^month(\d+)$/.exec(habit.freq||""); if(mm) return `每月 ${mm[1]} 次`;
  const dm=/^days:(.+)$/.exec(habit.freq||"");
  if(dm){ const names=["日","一","二","三","四","五","六"]; return "每周 "+dm[1].split(",").filter(x=>x!=="").map(i=>"周"+names[Number(i)]).join(" "); }
  return "习惯";
}

// 管理某个清单：重命名 / 删除
async function manageList(i){
  const list=state.day.lists[i];
  const act=await _openDialog({
    title:`管理清单「${list.name}」`,
    buttons:[
      {label:"重命名",style:"ghost",value:"rename"},
      {label:"删除清单",style:"dngr",value:"delete"},
      {label:"取消",style:"ghost",value:null},
    ],
  });
  if(act==="rename"){
    const name=(await dlgPrompt("重命名清单",{value:list.name,placeholder:"新的清单名称"})||"").trim();
    if(name && name!==list.name){ list.name=name; save(); rerender(); }
  }else if(act==="delete"){
    if(state.day.lists.length<=1){ await dlgAlert("至少保留一个清单"); return; }
    const cnt=list.tasks.length;
    if(cnt>0){
      const ok=await dlgConfirm(`其中 ${cnt} 个任务也会一并删除。`,{title:`删除清单「${list.name}」？`,okLabel:"删除",danger:true});
      if(!ok) return;
    }
    // 从其它任务的 children 引用里摘掉本清单里的任务
    const ids=list.tasks.map(t=>t.id);
    allTasks().forEach(t=>{ if(t.children) t.children=t.children.filter(id=>!ids.includes(id)); });
    state.day.lists.splice(i,1);
    if(current>=state.day.lists.length) current=state.day.lists.length-1;
    save(); rerender(); goTo(current);
  }
}

/* ---------- 渲染任务列表 ---------- */
// depth: 缩进层级; ownerView: 该任务实际所属视图(用于删除/拆解定位)
function renderTask(task, listRef, ownerView){
  const wrap=document.createElement("div");   // 容纳卡片 + 子节点
  const el=document.createElement("div");
  el.className="task"+(task.done?" done":"");

  const kids=childrenOf(task);
  const hasKids=kids.length>0;
  const prog=progressOf(task);

  // 勾选圈：永远在卡片最前，位置统一。有子节点时按进度显示环、点击=展开/收起（不可直接勾）
  const check=document.createElement("div");
  const pctRatio = prog.total? prog.done/prog.total : 0;
  const full = hasKids && pctRatio>=1;
  check.className="check"+(hasKids && !full ? " ring" : "");
  check.innerHTML=CHECK_SVG;
  if(hasKids){
    if(full){ el.classList.add("done"); }        // 全部子项完成 → 实心对勾
    else check.style.background = `conic-gradient(var(--accent) ${pctRatio*360}deg, #e3e5e8 0deg)`;
    check.onclick=(e)=>{ e.stopPropagation(); expanded[task.id]=!expanded[task.id]; rerender(); };
  }else{
    check.onclick=(e)=>{ e.stopPropagation(); task.done=!task.done; task.doneAt = task.done? Date.now() : null; if(task.done) playDing(); save(); rerender(); };
  }
  el.appendChild(check);

  const body=document.createElement("div");
  body.className="task-body";
  // 标题行：标题 + 时间 chip + 展开箭头（仅有子节点时，放在最右）
  const head=document.createElement("div");
  head.className="task-head";
  const txt=document.createElement("div");
  txt.className="task-text"; txt.textContent=task.text;
  txt.title="点击可重命名 / 改时间 / 挂靠 / 拆解";
  txt.onclick=(e)=>{ e.stopPropagation(); openTaskMenu(task, ownerView, listRef); };
  // 日程视图：时间作为前缀放在任务文字最前（24h 时刻，无 emoji、无"今天"）
  if(ownerView==="day" && task.due){
    const tp=document.createElement("span");
    tp.className="task-time"; tp.textContent=fmtTimeOnly(task.due);
    tp.onclick=(e)=>{ e.stopPropagation(); editTaskDue(task); };
    head.appendChild(tp);
  }
  head.appendChild(txt);
  // 时间 chip：非日程视图（周/月/年）仍在文字后显示完整日期时间；日程无时间的叶子给"＋时间"入口
  const timeChip=document.createElement("span");
  if(ownerView!=="day" && task.due){
    timeChip.className="chip time"; timeChip.textContent=fmtDue(task.due);
    timeChip.onclick=(e)=>{ e.stopPropagation(); editTaskDue(task); };
    head.appendChild(timeChip);
  }else if(!task.due && !hasKids){
    timeChip.className="chip addtime"; timeChip.textContent="＋时间";
    timeChip.onclick=(e)=>{ e.stopPropagation(); editTaskDue(task); };
    head.appendChild(timeChip);
  }
  if(hasKids){
    const chev=document.createElement("div");
    chev.className="task-chev"+(expanded[task.id]?" open":"");
    chev.textContent="▶";
    chev.onclick=(e)=>{ e.stopPropagation(); expanded[task.id]=!expanded[task.id]; rerender(); };
    head.appendChild(chev);
  }
  body.appendChild(head);

  // 父节点：极简进度（细条 + 百分比），圆圈已表进度，此处只做补充
  if(hasKids){
    const pct = prog.total? Math.round(prog.done/prog.total*100) : 0;
    const mini=document.createElement("div"); mini.className="prog-mini";
    const bar=document.createElement("div"); bar.className="prog";
    const fill=document.createElement("div"); fill.className="prog-fill"; fill.style.width=pct+"%";
    bar.appendChild(fill); mini.appendChild(bar);
    const pctEl=document.createElement("span"); pctEl.className="prog-pct"+(pct>=100?" alldone":"");
    pctEl.textContent = pct>=100 ? `✓ ${prog.done}/${prog.total}` : `${prog.done}/${prog.total}`;
    mini.appendChild(pctEl);
    body.appendChild(mini);
  }

  // 次要标签行：挂靠 / 拆解 / 专注（比标题小、灰）
  const tags=document.createElement("div");
  tags.className="task-tags";
  if(task.parentText){
    const c=document.createElement("span");
    c.className="chip parent"; c.textContent="↳ "+task.parentText;
    tags.appendChild(c);
  }
  const nextV=nextViewFor(ownerView);
  if(nextV){
    const b=document.createElement("span");
    b.className="chip break";
    // 支持跨级拆解：年→月/周/日、月→周/日、周→日。点一下弹层选目标层级
    const lowerAll=lowerViewsOf(ownerView);
    b.textContent = lowerAll.length>1 ? "＋ 拆解" : "＋ 拆解到"+VIEW_TITLE[nextV];
    b.onclick=(e)=>{ e.stopPropagation(); breakdown(task, ownerView); };
    tags.appendChild(b);
  }
  if(tags.children.length) body.appendChild(tags);

  // 专注按钮：仅日程叶子任务、且看的是今天。绝对定位到卡片右侧空白居中，圆形图标钮
  //           不显示"已专注 X 分钟"——那是时间轴/统计该呈现的，卡片保持清爽
  let focusBtn=null;
  if(ownerView==="day" && !hasKids && currentDate===todayStr()){
    el.classList.add("has-focus");
    focusBtn=document.createElement("div");
    focusBtn.className="focus-btn"; focusBtn.title="开始专注";
    focusBtn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    focusBtn.onclick=(e)=>{ e.stopPropagation(); openTimer(task); };
  }

  const del=document.createElement("div");
  del.className="del"; del.textContent="×";
  del.onclick=(e)=>{
    e.stopPropagation();
    // 有子节点时提醒会连同下级一起删除
    const kidCount=countDescendants(task);
    const msg = kidCount>0
      ? `这会同时删除它下面的 ${kidCount} 个子任务。`
      : "";
    dlgConfirm(msg,{title:`删除「${task.text}」？`,okLabel:"删除",danger:true}).then(ok=>{
      if(ok) removeTask(task, listRef);
    });
  };

  el.appendChild(body); el.appendChild(del);
  if(focusBtn) el.appendChild(focusBtn);
  wrap.appendChild(el);

  // 子节点（展开时递归渲染，能看到下一级完成情况）
  if(hasKids && expanded[task.id]){
    const box=document.createElement("div");
    box.className="children";
    const childView=nextViewFor(ownerView);
    const sorted=[...kids].sort((a,b)=>(isDoneEffective(a)?1:0)-(isDoneEffective(b)?1:0) || b.createdAt-a.createdAt);
    sorted.forEach(k=> box.appendChild(renderTask(k, findListRef(k), childView)));
    wrap.appendChild(box);
  }
  return wrap;
}

// 删除任务：同时从父节点的 children 里摘掉，并删掉其所有子孙
function countDescendants(task){
  let n=0;
  childrenOf(task).forEach(c=>{ n += 1 + countDescendants(c); });
  return n;
}
function removeTask(task, listRef){
  const collect=(t,acc)=>{ acc.push(t.id); childrenOf(t).forEach(c=>collect(c,acc)); return acc; };
  const ids=collect(task,[]);
  // 从所有容器中移除这些 id
  const scrub=arr=>{ for(let i=arr.length-1;i>=0;i--) if(ids.includes(arr[i].id)) arr.splice(i,1); };
  state.day.lists.forEach(l=>scrub(l.tasks));
  ["week","month","year"].forEach(v=>scrub(state[v].tasks));
  // 从任何父节点的 children 引用里移除
  allTasks().forEach(t=>{ if(t.children) t.children=t.children.filter(id=>!ids.includes(id)); });
  save(); rerender();
}

// 找到某任务所在的数组（用于删除定位）
function findListRef(task){
  for(const l of state.day.lists) if(l.tasks.includes(task)) return l.tasks;
  for(const v of ["week","month","year"]) if(state[v].tasks.includes(task)) return state[v].tasks;
  return [];
}

/* 任务是否"实际完成"：叶子看 done；父节点看所有后代叶子是否全完成（用于排序沉底） */
function isDoneEffective(task){
  if(task.done) return true;
  const p=progressOf(task);
  return !p.leaf && p.total>0 && p.done>=p.total;
}
function fillList(container, tasks, ownerView, emptyText){
  container.innerHTML="";
  if(!tasks.length){
    container.innerHTML='<div class="empty"><span class="big">🌿</span>'+emptyText+'</div>';
    return;
  }
  // 已完成的自动沉底；未完成内部按时间/新建排序
  const sorted=[...tasks].sort((a,b)=>
    (isDoneEffective(a)?1:0)-(isDoneEffective(b)?1:0)
    || (a.due&&b.due? new Date(a.due)-new Date(b.due) : b.createdAt-a.createdAt));
  sorted.forEach(t=>container.appendChild(renderTask(t, tasks, ownerView)));
}

// 当前日期下、某清单里的任务（按"任务时间"过滤）
// 任务归属哪天：优先看设定的时间 due（用户真正想做的日子），没有 due 才回退到 date（添加时所在的日子）
function taskDay(t){ return t.due ? dateStr(new Date(t.due)) : (t.date||""); }
function dayTasksOf(list){ return (list.tasks||[]).filter(t=>taskDay(t)===currentDate); }

/* ---------- 习惯卡片渲染 ---------- */
// 这个习惯今天是否"该做"：daily/次数型每天都可打；指定星期几只在对应日出现
function habitDueOn(habit, dateStr_){
  const dm=/^days:(.+)$/.exec(habit.freq||"");
  if(dm){ const set=dm[1].split(",").filter(x=>x!==""); return set.includes(String(new Date(dateStr_+"T00:00:00").getDay())); }
  return true;   // daily / weekN / monthN 每天都能打卡
}
// 日程视图：一条习惯打卡行（perDay===1 圆钮；perDay>1 步进）
function renderHabitDayRow(habit){
  const done=habitTodayCount(habit), per=habit.perDay||1;
  const reached=done>=per;
  const row=document.createElement("div");
  row.className="habit"+(reached?" reached":"");

  const body=document.createElement("div"); body.className="habit-body";
  const txt=document.createElement("div"); txt.className="habit-text"; txt.textContent=habit.text;
  body.appendChild(txt);
  const sub=document.createElement("div"); sub.className="habit-sub";
  sub.innerHTML=`<span>${habitFreqLabel(habit)}</span>`+(per>1?`<span class="cnt">${done}/${per}</span>`:(reached?`<span class="cnt">今天已完成 ✓</span>`:""));
  body.appendChild(sub);
  row.appendChild(body);

  if(per>1){
    const step=document.createElement("div"); step.className="habit-step";
    const minus=document.createElement("div"); minus.className="sbtn"+(done<=0?" dim":"");
    minus.textContent="−"; minus.onclick=(e)=>{ e.stopPropagation(); habitUncheck(habit); rerender(); };
    const num=document.createElement("div"); num.className="num"; num.textContent=`${done}/${per}`;
    const plus=document.createElement("div"); plus.className="sbtn plus"+(reached?" reached":"");
    plus.textContent="＋"; plus.onclick=(e)=>{ e.stopPropagation(); habitCheck(habit); if(done+1>=per) playDing(); rerender(); };
    step.appendChild(minus); step.appendChild(num); step.appendChild(plus);
    row.appendChild(step);
  }else{
    const tick=document.createElement("div"); tick.className="habit-tick"+(reached?" on reached":"");
    tick.innerHTML=CHECK_SVG;
    tick.onclick=(e)=>{ e.stopPropagation(); if(reached){ habitUncheck(habit); }else{ habitCheck(habit); playDing(); } rerender(); };
    row.appendChild(tick);
  }

  const del=document.createElement("div"); del.className="del"; del.textContent="×";
  del.onclick=(e)=>{ e.stopPropagation(); editHabit(habit); };
  row.appendChild(del);
  return row;
}
// 周/月/年清单：一条习惯比例行（本周 4/7、本月 21/30、今年 240/365，点右侧可原地为今天打卡）
function renderHabitRangeRow(habit, kind){
  const p=habitRangeProgress(habit, kind);
  const label={week:"本周",month:"本月",year:"今年"}[kind]||"";
  const row=document.createElement("div");
  row.className="habit"+(p.reached?" reached":"");
  const body=document.createElement("div"); body.className="habit-body";
  body.innerHTML=`<div class="habit-text">${escapeHtml(habit.text)}</div>
    <div class="habit-sub"><span>${habitFreqLabel(habit)}</span></div>
    <div class="habit-bar"><div class="habit-bar-fill" style="width:${Math.round(p.ratio*100)}%"></div></div>`;
  row.appendChild(body);
  const ratio=document.createElement("div"); ratio.className="habit-ratio";
  ratio.textContent=`${label} ${p.done}/${p.total}`+(p.reached?" ✓":"");
  row.appendChild(ratio);
  const del=document.createElement("div"); del.className="del"; del.textContent="×";
  del.onclick=(e)=>{ e.stopPropagation(); editHabit(habit); };
  row.appendChild(del);
  return row;
}
// 把习惯区块插到容器最前（日程用 day 行，周/月/年用比例行）
function prependHabits(container, kind){
  const habits=(state.habits||[]).filter(h=> kind!=="day" || habitDueOn(h,currentDate));
  if(!habits.length) return;
  const sec=document.createElement("div"); sec.className="habit-section";
  const lb=document.createElement("div"); lb.className="habit-label";
  lb.innerHTML=`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> 习惯打卡`;
  sec.appendChild(lb);
  habits.forEach(h=> sec.appendChild(kind==="day"? renderHabitDayRow(h) : renderHabitRangeRow(h,kind)));
  // 习惯与任务分区：习惯区加下分隔线，并在任务列表上方补一个"任务"小标题（日/周/月/年一致）
  sec.classList.add("habit-section--divided");
  const hasTasks = container.querySelector(".task") || container.querySelector(".empty");
  if(hasTasks){

/* ---------- 时间轴：把某天的专注 session 按墙钟排布 ---------- */
// 冷色系调色板，任务 id 稳定哈希取色，跟主色协调
const TL_COLORS=["#5b9df0","#4fc0d8","#5ec6a8","#7aa7f5","#49b0e0","#6bd0c2","#8fb4f7","#57b8cf"];
function colorOf(id){
  let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0;
  return TL_COLORS[h%TL_COLORS.length];
}
// 收集某天（YYYY-MM-DD）所有 session，附带所属任务
function daySessions(dateStr_){
  const out=[];
  state.day.lists.forEach(l=>(l.tasks||[]).forEach(t=>{
    (t.sessions||[]).forEach(s=>{
      if(dateStr(new Date(s.start))===dateStr_) out.push({ task:t, ...s });
    });
  }));
  return out.sort((a,b)=>a.start-b.start);
}
function renderTimeline(){
  const sessions=daySessions(currentDate);
  if(!sessions.length){
    singleEl.innerHTML='<div class="tl-empty"><span class="big">🍅</span>今天还没有专注记录<br>点任务上的「▶ 专注」开始第一段番茄钟</div>';
    return;
  }
  const wrap=document.createElement("div");
  wrap.className="timeline-wrap";

  // —— 专注分布：默认扇形图，可切条形图（放在最前面）——
  const byTask={};
  sessions.forEach(s=>{ (byTask[s.task.id] ||= {task:s.task, sec:0}).sec+=s.focusSec||0; });
  const rows=Object.values(byTask).sort((a,b)=>b.sec-a.sec);
  const totalSec=rows.reduce((s,r)=>s+r.sec,0);

  const stats=document.createElement("div");
  stats.className="tl-stats";
  const head=document.createElement("div");
  head.className="tl-sec-head";
  head.innerHTML=`<h3>专注分布</h3>
    <div class="tl-chart-toggle">
      <div class="seg${chartMode==='pie'?' on':''}" data-chart="pie" title="扇形图">${ICON_PIE}</div>
      <div class="seg${chartMode==='bar'?' on':''}" data-chart="bar" title="条形图">${ICON_BAR}</div>
    </div>`;
  stats.appendChild(head);
  const chartBox=document.createElement("div");
  chartBox.className="tl-chart-box";
  stats.appendChild(chartBox);
  renderChart(chartBox, rows, totalSec);
  head.querySelectorAll(".seg").forEach(seg=>{
    seg.onclick=()=>{
      chartMode=seg.dataset.chart;
      head.querySelectorAll(".seg").forEach(s=>s.classList.toggle("on", s.dataset.chart===chartMode));
      renderChart(chartBox, rows, totalSec);
    };
  });
  wrap.appendChild(stats);

  // —— 时间轴：自动适配范围（最早开始 → 最晚结束）——
  const tlHead=document.createElement("div");
  tlHead.className="tl-sec-head";
  tlHead.style.marginTop="4px";
  tlHead.innerHTML="<h3>时间轴</h3>";
  wrap.appendChild(tlHead);

  const minS=Math.min(...sessions.map(s=>s.start));
  const maxE=Math.max(...sessions.map(s=>s.end));
  const startH=Math.max(0, new Date(minS).getHours() - (new Date(minS).getMinutes()<30?1:0));
  let endH=new Date(maxE).getHours() + (new Date(maxE).getMinutes()>0?1:0) + (new Date(maxE).getMinutes()>=30?1:0);
  endH=Math.min(24, Math.max(endH, startH+1));
  const base=new Date(currentDate+"T00:00:00"); base.setHours(startH,0,0,0);
  const top=base.getTime();
  const span=(endH-startH)*3600000;    // 总跨度(ms)
  const PX_PER_HOUR=64;
  const gridH=(endH-startH)*PX_PER_HOUR;

  const grid=document.createElement("div");
  grid.className="tl-grid"; grid.style.height=gridH+"px";
  for(let h=startH;h<=endH;h++){
    const row=document.createElement("div");
    row.className="tl-hour";
    row.style.top=((h-startH)*PX_PER_HOUR)+"px";
    row.innerHTML=`<span class="hh">${String(h).padStart(2,"0")}:00</span><span class="ln"></span>`;
    grid.appendChild(row);
  }
  const blocks=document.createElement("div");
  blocks.className="tl-blocks"; blocks.style.height=gridH+"px";
  sessions.forEach(s=>{
    const b=document.createElement("div");
    b.className="tl-block";
    const y=(s.start-top)/span*gridH;
    let h=(s.end-s.start)/span*gridH;
    if(h<18) h=18;   // 太短也要看得见
    b.style.top=y+"px"; b.style.height=h+"px";
    b.style.background=colorOf(s.task.id);
    const t1=new Date(s.start), t2=new Date(s.end);
    const hm=d=>`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    b.innerHTML=`<b>${escapeHtml(s.task.text)}</b> <span class="bt">${hm(t1)}–${hm(t2)}</span>`;
    blocks.appendChild(b);
  });
  grid.appendChild(blocks);
  wrap.appendChild(grid);

  singleEl.innerHTML="";
  singleEl.appendChild(wrap);
}

// 专注分布图：扇形（环形）或条形，二选一渲染到容器
function renderChart(box, rows, totalSec){
  box.innerHTML="";
  if(chartMode==="pie"){
    const R=54, C=2*Math.PI*R, size=132;   // R + 半个描边(9) + 余量 ≤ size/2(66)，避免圆被视口切边
    let off=0;
    let segs="";
    rows.forEach(r=>{
      const frac=totalSec? r.sec/totalSec : 0;
      const len=frac*C;
      segs+=`<circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none"
        stroke="${colorOf(r.task.id)}" stroke-width="18"
        stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`;
      off+=len;
    });
    const legend=rows.map(r=>{
      const pct=totalSec? Math.round(r.sec/totalSec*100):0;
      return `<div class="lg"><span class="tl-dot" style="background:${colorOf(r.task.id)}"></span>
        <span class="nm">${escapeHtml(r.task.text)}</span>
        <span class="vl">${pct}% · ${fmtDur(r.sec)}</span></div>`;
    }).join("");
    box.innerHTML=`<div class="tl-pie-wrap">
      <div class="tl-pie">
        <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
          <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="var(--line)" stroke-width="18"/>
          ${segs}
        </svg>
        <div class="tl-pie-center"><span class="big">${fmtDur(totalSec)}</span><span class="sm">共 ${rows.length} 个任务</span></div>
      </div>
      <div class="tl-pie-legend">${legend}</div>
    </div>`;
  }else{
    const bc=document.createElement("div");
    bc.className="tl-barchart";
    rows.forEach(r=>{
      const pct=totalSec? Math.round(r.sec/totalSec*100):0;
      const col=colorOf(r.task.id);
      const row=document.createElement("div");
      row.className="tl-stat-row";
      row.innerHTML=`<div class="tl-dot" style="background:${col}"></div>
        <div class="tl-stat-body">
          <div class="tl-stat-top"><span class="nm">${escapeHtml(r.task.text)}</span><span class="mins">${fmtDur(r.sec)} · ${pct}%</span></div>
          <div class="tl-bar"><div class="tl-bar-fill" style="width:${pct}%;background:${col}"></div></div>
        </div>`;
      bc.appendChild(row);
    });
    box.appendChild(bc);
    const tot=document.createElement("div");
    tot.className="tl-total"; tot.textContent="共 "+fmtDur(totalSec)+" · "+rows.length+" 个任务";
    box.appendChild(tot);
  }
}

/* ---------- 月度概览：本月各目标铺在哪几天、哪些没动 ---------- */
// 月份工具：YYYY-MM 的天数、前后翻月、友好标题
function daysInMonth(ym){ const [y,m]=ym.split("-").map(Number); return new Date(y,m,0).getDate(); }
function shiftMonth(ym, delta){
  const [y,m]=ym.split("-").map(Number);
  const d=new Date(y, m-1+delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function fmtMonthLabel(ym){ const [y,m]=ym.split("-"); return `${y}年${Number(m)}月`; }
// 某目标在指定月的展现数据：活动日区间、状态
function monthSpanOf(task, ym){
  const dim=daysInMonth(ym);
  // 手动校准优先
  let sd=null, ed=null, manual=false;
  if(task.manualSpan && task.manualSpan.start){
    sd=task.manualSpan.start; ed=task.manualSpan.end||task.manualSpan.start; manual=true;
  }
  // 自动：从后代叶子活动日期里取落在本月的
  const inMonth=[...activeDatesOf(task)].filter(d=>d.slice(0,7)===ym).sort();
  const autoStart=inMonth[0]||null, autoEnd=inMonth[inMonth.length-1]||null;
  if(!manual){ sd=autoStart; ed=autoEnd; }
  // 完成日（若在本月）
  const doneDate = task.doneAt? dateStr(new Date(task.doneAt)) : null;
  const doneInMonth = doneDate && doneDate.slice(0,7)===ym ? doneDate : null;
  const prog=progressOf(task);
  const isDone = prog.total>0 && prog.done>=prog.total;
  const hasActivity = !!(sd || inMonth.length);
  let status = isDone ? "done" : (hasActivity ? "doing" : "idle");
  return { dim, start:sd, end:ed, manual, activeDays:inMonth, doneInMonth, isDone, status, prog,
           dayNum:d=>Number(d.slice(8,10)) };
}
// 概览：周/月/年通用。按状态分组（进行中 / 已完成 / 未完成）成卡片列表
// 月计划额外带"翻月"条，其它视图不带
function renderOverview(v){
  singleEl.innerHTML="";
  const wrap=document.createElement("div");
  wrap.className="mv-wrap";

  // 月计划：保留翻月条（跨度按所选月计算）；周/年不翻
  if(v==="month"){
    const mbar=document.createElement("div");
    mbar.className="mv-monthbar";
    mbar.innerHTML=`<div class="nav-arrow" id="mvPrev">‹</div>
      <div class="mv-month-label">${fmtMonthLabel(mvMonth)}</div>
      <div class="nav-arrow" id="mvNext">›</div>`;
    wrap.appendChild(mbar);
    mbar.querySelector("#mvPrev").onclick=()=>{ mvMonth=shiftMonth(mvMonth,-1); rerender(); };
    mbar.querySelector("#mvNext").onclick=()=>{ mvMonth=shiftMonth(mvMonth,1); rerender(); };
  }

  const tasks=state[v].tasks||[];
  const habits=state.habits||[];
  if(!tasks.length && !habits.length){
    const e=document.createElement("div");
    e.className="mv-empty";
    const emptyMsg={week:"这周还没有目标",month:"这个月还没有目标",year:"今年还没有目标"}[v];
    e.innerHTML=`<span class="big">🗓️</span>${emptyMsg}<br>切回清单先写下要推进的事`;
    wrap.appendChild(e);
    singleEl.appendChild(wrap);
    return;
  }

  // 习惯打卡：概览里只给比例数字（本周/本月/今年 X/Y）
  if(habits.length){
    const lb=document.createElement("div");
    lb.className="mv-group-label"; lb.textContent=`习惯打卡（${habits.length}）`;
    wrap.appendChild(lb);
    habits.forEach(h=>wrap.appendChild(renderHabitRangeRow(h, v)));
  }

  // 按状态分组：进行中 / 已完成 / 未完成
  const groups={doing:[],done:[],idle:[]};
  tasks.forEach(t=>groups[ovStatusOf(t,v).status].push(t));
  const order=[["doing","进行中"],["done","已完成"],["idle","未完成"]];
  order.forEach(([key,label])=>{
    if(!groups[key].length) return;
    const lb=document.createElement("div");
    lb.className="mv-group-label"; lb.textContent=`${label}（${groups[key].length}）`;
    wrap.appendChild(lb);
    groups[key].forEach(t=>wrap.appendChild(renderOvRow(t,v)));
  });
  singleEl.appendChild(wrap);
}
// 目标的概览状态：月计划用 monthSpanOf（带活动日）；周/年只判进行中/完成/未动
function ovStatusOf(task,v){
  if(v==="month") return monthSpanOf(task, mvMonth);
  const prog=progressOf(task);
  const isDone = prog.total>0 && prog.done>=prog.total;
  // 有子任务活动过（任一后代叶子有 date/session/完成）视为进行中
  const active = activeDatesOf(task).size>0 || prog.done>0;
  const status = isDone ? "done" : (active ? "doing" : "idle");
  return { prog, isDone, status };
}
// 周/年概览行：目标名 + 状态徽章 + X/Y 项完成（不含铺在哪几天，那是月计划专属）
function renderOvRow(task,v){
  if(v==="month") return renderMvRow(task);
  const info=ovStatusOf(task,v);
  const col=colorOf(task.id);
  const row=document.createElement("div");
  row.className="mv-row"+(info.isDone?" done":"");
  const top=document.createElement("div");
  top.className="mv-row-top";
  const badgeText={doing:"进行中",done:"已完成",idle:"未完成"}[info.status];
  top.innerHTML=`<span class="mv-color-dot" style="background:${col}"></span>
    <span class="mv-name">${escapeHtml(task.text)}</span>
    <span class="mv-badge ${info.status}">${badgeText}</span>`;
  row.appendChild(top);
  if(info.prog.total>0){
    const meta=document.createElement("div");
    meta.className="mv-meta";
    meta.innerHTML=`<span>已完成 ${info.prog.done}/${info.prog.total} 项</span>`;
    row.appendChild(meta);
  }
  return row;
}
// 把活动日数组压成一句可读文字："铺在 3日、5日、8日" / "3日–10日（手动）"
function fmtSpread(info){
  if(info.manual && info.start){
    const s=info.dayNum(info.start), e=info.dayNum(info.end||info.start);
    return (s===e? `${s}日` : `${s}日 – ${e}日`)+"（手动指定）";
  }
  const days=(info.activeDays||[]).map(info.dayNum);
  if(!days.length) return "本月还没动";
  if(days.length<=4) return "铺在 "+days.map(d=>d+"日").join("、");
  const s=days[0], e=days[days.length-1];
  return `铺在 ${s}日 – ${e}日，共 ${days.length} 天`;
}
function renderMvRow(task){
  const info=monthSpanOf(task, mvMonth);
  const col=colorOf(task.id);
  const row=document.createElement("div");
  row.className="mv-row"+(info.isDone?" done":"");

  const top=document.createElement("div");
  top.className="mv-row-top";
  const badgeText={doing:"进行中",done:"已完成",idle:"还没动"}[info.status];
  top.innerHTML=`<span class="mv-color-dot" style="background:${col}"></span>
    <span class="mv-name">${escapeHtml(task.text)}</span>
    <span class="mv-badge ${info.status}">${badgeText}</span>
    <span class="mv-edit" title="校准起止日期"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>`;
  top.querySelector(".mv-edit").onclick=()=>openMvEdit(task);
  row.appendChild(top);

  const meta=document.createElement("div");
  meta.className="mv-meta";
  meta.innerHTML=`<span>${fmtSpread(info)}</span><span>${info.prog.done}/${info.prog.total} 项完成</span>`;
  row.appendChild(meta);
  return row;
}

    inputEl.placeholder = "回车添加…";
    renderDay();
  }else if(view!=="day" && ovMode[view]==="overview"){

    renderOverview(view);
  }else{
    trackEl.style.display="none"; singleEl.style.display="block";
    renderSingle();
  }
  renderTabs(); updateHeader(); syncModeToggle();
}

function updateHeader(){
  if(view==="day" && dayMode==="timeline"){

  }else if(view==="day"){

/* ---------- 时长格式：秒 → Xh Ym / Ym ---------- */
function fmtDur(sec){
  const m=Math.round(sec/60);
  if(m<60) return m+" 分钟";
  const h=Math.floor(m/60), mm=m%60;
  return mm? `${h} 小时 ${mm} 分` : `${h} 小时`;
}

/* ---------- 时间格式 ---------- */
function fmtDue(iso){
  const d=new Date(iso), now=new Date();
  const pad=n=>String(n).padStart(2,"0");
  const sameDay=d.toDateString()===now.toDateString();
  const tmr=new Date(now); tmr.setDate(now.getDate()+1);
  const isTmr=d.toDateString()===tmr.toDateString();
  const hm=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if(sameDay) return "今天 "+hm;
  if(isTmr) return "明天 "+hm;
  return `${d.getMonth()+1}月${d.getDate()}日 ${hm}`;
}
// 仅时刻（24h HH:mm），用于日程卡片把时间放在任务文字最前
function fmtTimeOnly(iso){
  const d=new Date(iso), pad=n=>String(n).padStart(2,"0");
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ---------- 视图层级 & 拆解 ---------- */
function nextViewFor(v){ return {year:"month",month:"week",week:"day"}[v]||null; }
// 严格低于当前层的所有层级（用于跨级拆解）：年→[月,周,日]，月→[周,日]，周→[日]
function lowerViewsOf(v){ return {year:["month","week","day"],month:["week","day"],week:["day"]}[v]||[]; }
// 把 task 拆解为目标层 targetV 的一条子任务（可跨级）
// 拆到「日」时额外弹时间选择器（可跳过）；拆到周/月不强制时间
function breakdownTo(task, targetV){
  dlgPrompt(`拆解为一条${VIEW_TITLE[targetV]}任务`,{msg:`把「${task.text}」拆解到${VIEW_TITLE[targetV]}`,placeholder:`这条${VIEW_TITLE[targetV]}任务是…`}).then(raw=>{
    const text=(raw||"").trim();
    if(!text) return;
    const child={ id:uid(), text, done:false, createdAt:Date.now(), due:null, parentText:task.text, children:[], sessions:[] };
    if(targetV==="day"){ child.date=currentDate; state.day.lists[current].tasks.push(child); }
    else{ state[targetV].tasks.push(child); }
    if(!task.children) task.children=[];
    task.children.push(child.id);
    expanded[task.id]=true;   // 拆解后自动展开父节点，立即看到新子项
    save(); rerender();
    // 拆解后弹时间选择器，让用户顺手给新任务定时间（取消/清除都不影响任务已建成）
    openDatePicker({ value:"", withTime:true, title:`给「${text}」设置时间（可跳过）` }).then(res=>{
      if(res===undefined || res===null) return;   // 取消或清除：保持无时间
      child.due=res; save(); rerender();
    });
  });
}
function breakdown(task, ownerView){
  const lowers=lowerViewsOf(ownerView);
  if(!lowers.length) return;
  if(lowers.length===1){ breakdownTo(task, lowers[0]); return; }
  // 多个可选层级 → 弹层让用户选拆到哪一层（含跨级）
  _openDialog({
    title:`把「${task.text}」拆解到…`,
    buttons:[
      ...lowers.map(v=>({label:VIEW_TITLE[v],style:"ghost",value:v})),
      {label:"取消",style:"ghost",value:null},
    ],
  }).then(v=>{ if(v) breakdownTo(task, v); });
}

/* ---------- 点击任务卡：重命名 / 改时间 / 挂靠 / 拆解 ---------- */
async function openTaskMenu(task, ownerView, listRef){
  const canParent = (PARENT_GROUPS[ownerView]||[]).length>0;
  const canBreak = lowerViewsOf(ownerView).length>0;
  const buttons=[
    {label:"重命名",style:"ghost",value:"rename"},
    {label: task.due? "修改时间":"设置时间", style:"ghost", value:"time"},
  ];
  if(canParent) buttons.push({label: task.parentText? "重新挂靠上级":"挂靠到上级目标", style:"ghost", value:"parent"});
  if(canBreak)  buttons.push({label:"拆解到下级", style:"ghost", value:"break"});
  // 补记专注：仅日程叶子任务，把没用计时器的专注时间手动补进去
  const isLeaf = childrenOf(task).length===0;
  if(ownerView==="day" && isLeaf) buttons.push({label:"补记一段专注", style:"ghost", value:"logfocus"});
  // 换清单：仅日程视图、且有多个清单、且该任务是某清单的顶层任务时可用
  const dayListIdx = (ownerView==="day") ? state.day.lists.findIndex(l=>l.tasks.includes(task)) : -1;
  if(dayListIdx>=0 && state.day.lists.length>1) buttons.push({label:"移动到清单…", style:"ghost", value:"movelist"});
  buttons.push({label:"取消",style:"ghost",value:null});
  const act=await _openDialog({ title:`「${task.text}」`, buttons });
  if(act==="rename"){
    const name=(await dlgPrompt("重命名任务",{value:task.text,placeholder:"任务名称"})||"").trim();
    if(name && name!==task.text){
      // 同步所有把它当上级的子任务的 parentText 展示文案
      const oldText=task.text; task.text=name;
      allTasks().forEach(t=>{ if(t.parentText===oldText) t.parentText=name; });
      save(); rerender();
    }
  }else if(act==="time"){
    editTaskDue(task);
  }else if(act==="parent"){
    openParentPicker(task, ownerView);
  }else if(act==="break"){
    breakdown(task, ownerView);
  }else if(act==="logfocus"){
    addManualSession(task);
  }else if(act==="movelist"){
    moveTaskToList(task, dayListIdx);
  }
}
// 把日程顶层任务从当前清单移动到另一个清单
async function moveTaskToList(task, fromIdx){
  const targets=state.day.lists
    .map((l,i)=>({l,i}))
    .filter(o=>o.i!==fromIdx)
    .map(o=>({label:o.l.name||`清单${o.i+1}`, style:"ghost", value:o.i}));
  targets.push({label:"取消",style:"ghost",value:null});
  const to=await _openDialog({ title:"移动到哪个清单？", buttons:targets });
  if(to===null || to===undefined) return;
  const from=state.day.lists[fromIdx];
  const pos=from.tasks.indexOf(task);
  if(pos<0) return;
  from.tasks.splice(pos,1);
  state.day.lists[to].tasks.push(task);
  save(); rerender();
}

    due:(useTime&&timeField.dataset.val)? timeField.dataset.val : null, parentText:null, children:[], sessions:[] };

/* ---------- 挂靠上级：选一个更高层目标 ---------- */
// 各视图可挂靠的上级层级（严格高于当前层：日<周<月<年）
const PARENT_GROUPS={
  day:[["year","年度目标"],["month","月计划"],["week","周计划"]],
  week:[["year","年度目标"],["month","月计划"]],
  month:[["year","年度目标"]],
  year:[]
};
// 挂靠上级：底部弹层，按层级分组竖排，点一项即选中
// 两种模式：composer 新任务（parentPickTask=null，选中记到 pendingParentId）；
//          已存在任务（parentPickTask 有值，点一下立即改挂并保存）
function renderParentSheet(){
  parentBodyEl.innerHTML="";
  const editing=parentPickTask;
  const layer=editing? parentPickView : view;
  const groups=PARENT_GROUPS[layer]||[];
  const curParentId=editing? parentIdOf(editing) : pendingParentId;
  let any=false;
  groups.forEach(([v,label])=>{
    const tasks=(state[v].tasks||[]).filter(t=> !editing || t.id!==editing.id);
    if(!tasks.length) return;
    any=true;
    const lb=document.createElement("div");
    lb.className="ph-group-label"; lb.textContent=label;
    parentBodyEl.appendChild(lb);
    tasks.forEach(t=>{
      const opt=document.createElement("div");
      const on=curParentId===t.id;
      opt.className="ph-opt"+(on?" sel":"");
      opt.innerHTML=`<span class="radio"></span><span class="txt">${escapeHtml(t.text)}</span>`;
      opt.onclick=()=>{
        if(editing){
          on? unlinkParent(editing) : linkParent(editing, t);
          save(); closeParentSheet(); rerender();
        }else{
          pendingParentId = on? null : t.id; renderParentSheet();
        }
      };
      parentBodyEl.appendChild(opt);
    });
  });
  if(!any){
    const tip={day:"先去「周/月/年」写下目标",week:"先去「月/年」写下目标",month:"先去「年度目标」写下目标"}[layer]||"先写下更高层的目标";
    parentBodyEl.innerHTML=`<div class="ph-empty">还没有上级目标<br>${tip}，<br>就能把它挂上去了</div>`;
  }
}
// 找到某任务当前挂靠的父目标 id（通过 children 反查）
function parentIdOf(task){ const p=allTasks().find(t=>t.children&&t.children.includes(task.id)); return p?p.id:null; }
// 把已存在任务挂到某上级：先从旧父摘除，再挂到新父
function linkParent(task, parent){
  unlinkParent(task);
  task.parentText=parent.text;
  if(!parent.children) parent.children=[];
  if(!parent.children.includes(task.id)) parent.children.push(task.id);
}
function unlinkParent(task){
  allTasks().forEach(t=>{ if(t.children) t.children=t.children.filter(id=>id!==task.id); });
  task.parentText=null;
}
function openParentSheet(){ parentPickTask=null; parentPickView=null; renderParentSheet(); parentMaskEl.classList.add("show"); }
function closeParentSheet(){ parentMaskEl.classList.remove("show"); parentPickTask=null; parentPickView=null; syncParentHint(); }
// 输入框上方的"已挂靠"提示条
function syncParentHint(){
  const p = pendingParentId? taskById(pendingParentId) : null;
  if(p){
    parentHintEl.innerHTML=`<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;"><path d="M6 4v7a4 4 0 0 0 4 4h8"/><path d="M14 11l4 4-4 4"/></svg><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">挂到「${escapeHtml(p.text)}」</span><span class="ph-x" id="phX">✕</span>`;
    parentHintEl.classList.add("show");
    parentBtn.classList.add("on");
    document.getElementById("phX").onclick=()=>{ pendingParentId=null; syncParentHint(); };
  }else{
    parentHintEl.classList.remove("show");
    parentHintEl.innerHTML="";
    parentBtn.classList.remove("on");
  }
}
